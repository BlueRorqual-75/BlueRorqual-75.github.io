<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>도구함</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:#07080a;
    background-image:radial-gradient(900px 500px at 50% -10%, #16202c 0%, #07080a 62%);
    color:#f4f7fa;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:460px;margin:0 auto}
  h1{
    font-size:22px;font-weight:700;letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .sub{color:#828b99;font-size:13.5px;margin:0 0 26px;line-height:1.5}
  .card{
    display:flex;align-items:center;gap:16px;
    padding:22px 20px;
    margin-bottom:14px;
    border-radius:20px;
    text-decoration:none;
    color:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
    min-height:96px;
  }
  .card:active{transform:scale(.975);background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));border-color:rgba(255,255,255,.18)}
  .icon{
    flex:0 0 auto;width:56px;height:56px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;line-height:1;
  }
  .icon.green{background:rgba(59,224,140,.14);border:1px solid rgba(59,224,140,.3)}
  .icon.blue{background:rgba(27,107,255,.16);border:1px solid rgba(27,107,255,.34)}
  .icon.amber{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.32)}
  .txt{min-width:0;flex:1}
  .title{font-size:18.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
  .desc{font-size:13px;color:#828b99;margin:0;line-height:1.45}
  .chev{flex:0 0 auto;color:#5c6675;font-size:20px;line-height:1}
  .foot{margin-top:24px;font-size:11.5px;color:#4d5461;text-align:center;line-height:1.6}
  @media (min-width:520px){
    h1{font-size:26px}
    .card{padding:26px 24px;min-height:110px}
    .title{font-size:20px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>도구함</h1>
    <p class="sub">휴대폰에서 바로 쓰는 세 가지</p>

    <a class="card" href="./workout/">
      <span class="icon green">💪</span>
      <span class="txt">
        <span class="title">맨몸 체력운동 5종</span>
        <span class="desc">시범 따라하기 · 시간 카운트다운</span>
      </span>
      <span class="chev">›</span>
    </a>

    <a class="card" href="./translator/">
      <span class="icon blue">🎙️</span>
      <span class="txt">
        <span class="title">음성 통역기</span>
        <span class="desc">말하면 바로 번역해서 들려줘요</span>
      </span>
      <span class="chev">›</span>
    </a>

    <a class="card" href="./pay/">
      <span class="icon amber">📅</span>
      <span class="txt">
        <span class="title">일당 계산기</span>
        <span class="desc">날짜별 일당 입력 · 3교대 근무표 · 월 합계</span>
      </span>
      <span class="chev">›</span>
    </a>

    <p class="foot">각 도구는 열어서 홈 화면에 추가하면 앱처럼 쓸 수 있어요.</p>
  </div>
</body>
</html>
