<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>음성 통역기</title>
<style>
  :root, [data-theme="light"]{
    --bg:#eef1f6;
    --bg-grad:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, #eef1f6 60%);
    --card:#ffffff;
    --card-2:#f6f8fc;
    --ink:#0d1117;
    --muted:#5b6573;
    --line:#dde3ec;
    --accent:#1b6bff;
    --accent-soft:#e7efff;
    --on-accent:#ffffff;
    --good:#12a150;
    --warn:#b45309;
    --bad:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.07);
  }
  [data-theme="dark"]{
    --bg:#0b0e13;
    --bg-grad:radial-gradient(1200px 600px at 50% -10%, #1a2130 0%, #0b0e13 60%);
    --card:#151a22;
    --card-2:#1b212b;
    --ink:#eef2f8;
    --muted:#98a3b3;
    --line:#28303c;
    --accent:#5b8dff;
    --accent-soft:#1d2b47;
    --on-accent:#08101f;
    --good:#31c46b;
    --warn:#f0a34a;
    --bad:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    background-image:var(--bg-grad);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button, select, textarea, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; border:0; background:none; }

  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    max-width:720px;
    margin:0 auto;
    overflow:hidden;
  }

  /* ── top bar ── */
  .bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:5px 8px 3px 12px; gap:8px; flex:0 0 auto;
  }
  .brand{ display:flex; align-items:center; gap:7px; font-weight:800; font-size:15px; letter-spacing:-.02em; }
  .netdot{ width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s; }
  .netdot.on{ background:var(--good); }
  .netdot.off{ background:var(--bad); }
  .bar-actions{ display:flex; gap:0; }
  .icon{
    width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    font-size:17px; color:var(--ink); background:transparent;
  }
  .icon:active{ background:var(--accent-soft); }

  /* ── language selectors ── */
  .langs{
    display:grid; grid-template-columns:1fr 40px 1fr; align-items:end; gap:6px;
    padding:0 10px 6px; flex:0 0 auto;
  }
  .sel{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .sel span{ font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.06em; padding-left:3px; }
  .sel select{
    width:100%; height:40px; padding:0 26px 0 11px;
    border:1px solid var(--line); border-radius:13px; background:var(--card);
    font-size:14.5px; font-weight:700; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 17px, calc(100% - 10px) 17px;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    box-shadow:var(--shadow);
  }
  .swap{
    height:40px; width:40px; border-radius:13px; border:1px solid var(--line);
    background:var(--card); font-size:16px; color:var(--muted); box-shadow:var(--shadow);
  }
  .swap:active{ transform:scale(.94); color:var(--accent); }

  /* ── stage ── */
  .stage{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
    padding:0 10px 4px; gap:6px;
  }
  .card{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:5px;
    background:var(--card); border-radius:18px; box-shadow:var(--shadow);
    padding:9px 11px;
  }
  .srcline{
    flex:0 0 auto; display:flex; gap:7px; align-items:flex-start;
    padding:0 0 6px; border-bottom:1px solid var(--line);
  }
  .srcline[hidden]{ display:none; }
  .srcline .tag{ font-size:10px; font-weight:800; color:var(--muted); padding-top:2px; flex:0 0 auto; letter-spacing:.04em; }
  .srcline p{
    margin:0; font-size:12.5px; line-height:1.4; color:var(--muted); word-break:keep-all;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .result{
    flex:1 1 auto; min-height:52px; overflow:auto; display:flex;
    align-items:center; justify-content:center; text-align:center;
    padding:2px 0;
  }
  .big{
    margin:0; width:100%; font-weight:800; letter-spacing:-.02em; line-height:1.28;
    word-break:keep-all; overflow-wrap:anywhere; white-space:pre-wrap; text-wrap:balance;
    transition:opacity .18s;
  }
  .big.dim{ opacity:.28; }
  .ph{
    margin:0; color:var(--muted); font-weight:700; font-size:17px; line-height:1.6;
    opacity:.75;
  }
  .ph small{ display:block; font-size:12.5px; font-weight:600; margin-top:8px; opacity:.85; }

  .resultfoot{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px;
    min-height:40px;
  }
  .badge{
    font-size:11.5px; font-weight:700; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:4px 8px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:44%;
  }
  .badge:empty{ visibility:hidden; }
  .badge.busy{ color:var(--accent); border-color:var(--accent); }
  .footbtns{ display:flex; gap:6px; }
  .footbtns button{
    height:40px; padding:0 11px; border-radius:11px; border:1px solid var(--line);
    background:var(--card); font-size:12.5px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow); white-space:nowrap;
  }
  .footbtns button:active{ background:var(--accent-soft); }
  .footbtns button:disabled{ opacity:.4; }

  /* ── banner ── */
  .banner{
    flex:0 0 auto; margin:0 10px 6px; padding:8px 10px; border-radius:12px;
    background:var(--accent-soft); color:var(--ink); font-size:11.5px; line-height:1.45;
    display:flex; gap:8px; align-items:flex-start; max-height:76px; overflow:auto;
  }
  .banner[hidden]{ display:none; }
  .banner .btext{ flex:1 1 auto; }
  .banner b{ font-weight:800; }
  .banner .bclose{ flex:0 0 auto; width:30px; height:30px; margin:-4px -2px 0 0; font-size:13px; font-weight:800; color:var(--accent); display:grid; place-items:center; }

  /* ── input bar ── */
  .inputbar{
    flex:0 0 auto; padding:7px 10px 8px; background:var(--card);
    border-top:1px solid var(--line); border-radius:18px 18px 0 0;
    box-shadow:0 -6px 20px rgba(16,24,40,.05);
  }
  .inputrow{ display:flex; gap:7px; align-items:flex-end; }
  textarea#input{
    flex:1 1 auto; resize:none; min-height:44px; max-height:84px;
    padding:11px 12px; border-radius:14px; border:1px solid var(--line);
    background:var(--card-2); font-size:16px; line-height:1.35; outline:none;
    overflow-y:auto; word-break:keep-all; overflow-wrap:anywhere;
  }
  textarea#input:focus{ border-color:var(--accent); background:var(--card); }
  .send{
    flex:0 0 auto; height:44px; padding:0 15px; border-radius:14px;
    background:var(--accent); color:var(--on-accent); font-weight:800; font-size:14px;
  }
  .send:active{ transform:scale(.97); }
  .microw{ display:flex; gap:7px; align-items:center; margin-top:7px; }
  .mic{
    flex:1 1 auto; height:48px; border-radius:15px; border:1.5px solid var(--line);
    background:var(--card-2); font-weight:800; font-size:15px; color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .mic:active{ transform:scale(.985); }
  .mic[aria-pressed="true"]{
    background:var(--bad); border-color:var(--bad); color:#fff;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(220,38,38,.42);} 70%{ box-shadow:0 0 0 14px rgba(220,38,38,0);} 100%{ box-shadow:0 0 0 0 rgba(220,38,38,0);} }
  .auto{
    flex:0 0 auto; height:48px; padding:0 12px; border-radius:15px; border:1px solid var(--line);
    background:var(--card-2); display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--muted);
  }
  .auto input{ width:17px; height:17px; accent-color:var(--accent); margin:0; }

  /* ── sheets ── */
  .backdrop{
    position:fixed; inset:0; background:rgba(8,12,20,.45); opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:40; backdrop-filter:blur(2px);
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--card); border-radius:20px 20px 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(102%); transition:transform .26s cubic-bezier(.22,.8,.3,1);
    max-height:78dvh; display:flex; flex-direction:column; gap:10px;
    box-shadow:0 -10px 40px rgba(0,0,0,.28); visibility:hidden;
  }
  .sheet.open{ transform:translateY(0); visibility:visible; }
  .sheet > *{ flex:0 0 auto; }
  .sheet header{ display:flex; align-items:center; justify-content:space-between; }
  .sheet h2{ margin:0; font-size:15.5px; font-weight:800; letter-spacing:-.01em; }
  .sheet .x{ width:36px; height:36px; border-radius:10px; font-size:15px; color:var(--muted); }
  .sheet .body{ flex:1 1 auto !important; overflow:auto; min-height:48px; -webkit-overflow-scrolling:touch; }
  .sheet .wide{ flex:0 0 auto; }

  .hist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .hist li{
    background:var(--card-2); border-radius:13px; padding:10px 12px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .hist .htext{ flex:1 1 auto; min-width:0; }
  .hist .hsrc{ font-size:12px; color:var(--muted); margin:0 0 3px; line-height:1.4; }
  .hist .hdst{ font-size:14px; font-weight:700; margin:0; line-height:1.4; word-break:keep-all; }
  .hist .hmeta{ font-size:10.5px; color:var(--muted); margin-top:5px; font-weight:700; letter-spacing:.02em; }
  .hist .hdel{ flex:0 0 auto; width:34px; height:34px; border-radius:9px; color:var(--muted); font-size:14px; display:grid; place-items:center; margin:-2px -4px 0 0; }
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:26px 0; }

  .diag{ display:flex; flex-direction:column; gap:9px; }
  .drow{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; padding:8px 11px; background:var(--card-2); border-radius:11px; }
  .drow .k{ color:var(--muted); font-weight:700; }
  .drow .v{ font-weight:800; text-align:right; }
  .v.ok{ color:var(--good); } .v.no{ color:var(--bad); } .v.mid{ color:var(--warn); }
  .dnote{ font-size:11.5px; color:var(--muted); line-height:1.55; }
  .wide{
    min-height:46px; border-radius:12px; background:var(--accent); color:var(--on-accent);
    font-weight:800; font-size:14px;
  }

  /* ── fullscreen view ── */
  .fs{
    position:fixed; inset:0; z-index:60; background:var(--bg);
    display:none; flex-direction:column; padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
  }
  .fs.open{ display:flex; }
  .fs .fstop{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex:0 0 auto; }
  .fs .fslang{ font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.04em; }
  .fs .fsclose{ width:42px; height:42px; border-radius:12px; font-size:18px; color:var(--muted); }
  .fs .fsbody{ flex:1 1 auto; min-height:0; overflow:auto; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px 0; }
  .fs .fsbig{ margin:0; font-weight:800; line-height:1.28; letter-spacing:-.02em; word-break:keep-all; overflow-wrap:anywhere; text-wrap:balance; }
  .fs .fsbtns{ flex:0 0 auto; display:flex; gap:8px; }
  .fs .fsbtns button{
    flex:1 1 0; height:50px; border-radius:14px; border:1px solid var(--line); background:var(--card);
    font-weight:800; font-size:14px; color:var(--ink);
  }

  /* ── toast ── */
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%,10px);
    background:rgba(20,26,36,.94); color:#fff; font-size:13px; font-weight:700;
    padding:10px 16px; border-radius:12px; z-index:80; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; max-width:86vw; text-align:center; line-height:1.45;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-height:600px){
    .ph{ font-size:14px; }
    .mic{ height:44px; }
    .auto{ height:44px; }
    .card{ padding:7px 9px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="netdot" id="netDot"></span>음성 통역기</div>
    <div class="bar-actions">
      <button class="icon" id="btnHistory" aria-label="최근 번역 기록">🕘</button>
      <button class="icon" id="btnDiag" aria-label="동작 진단">🩺</button>
      <button class="icon" id="btnTheme" aria-label="밝게/어둡게 전환">◐</button>
    </div>
  </header>

  <div class="langs">
    <label class="sel"><span>출발</span><select id="srcSel" aria-label="출발 언어"></select></label>
    <button class="swap" id="btnSwap" aria-label="출발·도착 언어 맞바꾸기">⇄</button>
    <label class="sel"><span>도착</span><select id="dstSel" aria-label="도착 언어"></select></label>
  </div>

  <main class="stage">
    <div class="card">
      <div class="srcline" id="srcLine" hidden>
        <span class="tag">원문</span>
        <p id="srcLineText"></p>
      </div>
      <div class="result" id="resultBox">
        <p class="ph" id="ph">말하거나 입력하면<small>번역이 크게 표시됩니다</small></p>
        <p class="big" id="big" hidden></p>
      </div>
    </div>

    <div class="resultfoot">
      <span class="badge" id="badge"></span>
      <div class="footbtns">
        <button id="btnSpeak" disabled>🔊 읽기</button>
        <button id="btnCopy" disabled>⧉ 복사</button>
        <button id="btnFull" disabled>⛶ 크게</button>
      </div>
    </div>
  </main>

  <div class="banner" id="banner" hidden>
    <div class="btext" id="bannerText"></div>
    <button class="bclose" id="bannerClose" aria-label="안내 닫기">✕</button>
  </div>

  <footer class="inputbar">
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="말하거나 입력하세요" enterkeyhint="send" autocomplete="off" autocorrect="off"></textarea>
      <button class="send" id="btnGo">번역</button>
    </div>
    <div class="microw">
      <button class="mic" id="btnMic" aria-pressed="false"><span id="micIcon">🎤</span><span id="micLabel">말하기</span></button>
      <label class="auto" for="autoSpeak"><input type="checkbox" id="autoSpeak"><span>자동 읽기</span></label>
    </div>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>

<section class="sheet" id="histSheet" aria-label="최근 번역 기록">
  <header><h2>최근 번역</h2><button class="x" id="histClose" aria-label="닫기">✕</button></header>
  <div class="body"><ul class="hist" id="histList"></ul></div>
  <button class="wide" id="histClear" style="background:var(--card-2);color:var(--ink);border:1px solid var(--line)">기록 모두 지우기</button>
</section>

<section class="sheet" id="diagSheet" aria-label="동작 진단">
  <header><h2>동작 진단</h2><button class="x" id="diagClose" aria-label="닫기">✕</button></header>
  <div class="body">
    <div class="diag" id="diagList"></div>
    <p class="dnote" style="margin-top:10px">이 화면은 지금 이 기기에서 무엇이 되고 무엇이 안 되는지 실제로 확인한 결과입니다. 번역 엔진은 아래 버튼으로 직접 연결해 봅니다.<br>번역은 무료 공개 API(Google·MyMemory)를 쓰기 때문에 아주 많은 양을 연속으로 돌리면 잠시 제한될 수 있습니다. 그때는 잠시 뒤 다시 시도해 주세요.</p>
  </div>
  <button class="wide" id="diagRun">번역 엔진 연결 테스트</button>
</section>

<div class="fs" id="fs">
  <div class="fstop">
    <span class="fslang" id="fsLang">영어</span>
    <button class="fsclose" id="fsClose" aria-label="전체화면 닫기">✕</button>
  </div>
  <div class="fsbody"><p class="fsbig" id="fsBig"></p></div>
  <div class="fsbtns">
    <button id="fsSpeak">🔊 읽어주기</button>
    <button id="fsCopy">⧉ 복사</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ══════════════ 언어 ══════════════ */
  var LANGS = [
    { c:"ko",    n:"한국어",        s:"ko-KR" },
    { c:"en",    n:"영어",          s:"en-US" },
    { c:"ja",    n:"일본어",        s:"ja-JP" },
    { c:"zh-CN", n:"중국어(간체)",  s:"zh-CN" },
    { c:"zh-TW", n:"중국어(번체)",  s:"zh-TW" },
    { c:"es",    n:"스페인어",      s:"es-ES" },
    { c:"fr",    n:"프랑스어",      s:"fr-FR" },
    { c:"vi",    n:"베트남어",      s:"vi-VN" },
    { c:"th",    n:"태국어",        s:"th-TH" },
    { c:"de",    n:"독일어",        s:"de-DE" },
    { c:"ru",    n:"러시아어",      s:"ru-RU" },
    { c:"id",    n:"인도네시아어",  s:"id-ID" },
    { c:"ar",    n:"아랍어",        s:"ar-SA" },
    { c:"it",    n:"이탈리아어",    s:"it-IT" },
    { c:"pt",    n:"포르투갈어",    s:"pt-BR" },
    { c:"hi",    n:"힌디어",        s:"hi-IN" },
    { c:"tr",    n:"터키어",        s:"tr-TR" },
    { c:"mn",    n:"몽골어",        s:"mn-MN" },
    { c:"km",    n:"크메르어",      s:"km-KH" },
    { c:"my",    n:"미얀마어",      s:"my-MM" },
    { c:"ms",    n:"말레이어",      s:"ms-MY" },
    { c:"tl",    n:"필리핀어",      s:"tl-PH" },
    { c:"uk",    n:"우크라이나어",  s:"uk-UA" },
    { c:"ne",    n:"네팔어",        s:"ne-NP" }
  ];
  var BY = {};
  LANGS.forEach(function(l){ BY[l.c] = l; });
  function langName(c){ return BY[c] ? BY[c].n : c; }
  function bcp(c){ return BY[c] ? BY[c].s : c; }

  /* ══════════════ 상태 ══════════════ */
  var ST_KEY = "interp.state.v1", HI_KEY = "interp.history.v1", BN_KEY = "interp.banner.v1";
  var state = { src:"ko", dst:"en", theme:"auto", autoSpeak:false };
  try {
    var saved = JSON.parse(localStorage.getItem(ST_KEY) || "null");
    if (saved && saved.src) state.src = saved.src;
    if (saved && saved.dst) state.dst = saved.dst;
    if (saved && saved.theme) state.theme = saved.theme;
    if (saved) state.autoSpeak = !!saved.autoSpeak;
  } catch(e) {}
  function saveState(){ try{ localStorage.setItem(ST_KEY, JSON.stringify(state)); }catch(e){} }

  /* ══════════════ 원소 ══════════════ */
  var $ = function(id){ return document.getElementById(id); };
  var srcSel=$("srcSel"), dstSel=$("dstSel"), inputEl=$("input");
  var bigEl=$("big"), phEl=$("ph"), resultBox=$("resultBox");

  /* ══════════════ 번역 엔진 ══════════════ */
  // 검증된 순서: Google(clients5) → Google(gtx) → MyMemory
  var CACHE = {};

  function fetchJSON(url, ms){
    return new Promise(function(resolve, reject){
      var done = false;
      var ctrl = null;
      try { ctrl = new AbortController(); } catch(e) {}
      var timer = setTimeout(function(){
        if (done) return; done = true;
        try { if (ctrl) ctrl.abort(); } catch(e) {}
        reject(new Error("timeout"));
      }, ms || 8000);
      var opts = { method:"GET", cache:"no-store" };
      if (ctrl) opts.signal = ctrl.signal;
      fetch(url, opts).then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      }).then(function(txt){
        if (done) return; done = true; clearTimeout(timer);
        var json;
        try { json = JSON.parse(txt); }
        catch(e){ throw new Error("JSON 아님"); }
        resolve(json);
      }).catch(function(err){
        if (done) return; done = true; clearTimeout(timer);
        reject(err);
      });
    });
  }

  function parseGoogle5(j){
    var parts = [];
    if (!Array.isArray(j)) {
      if (j && typeof j.trans === "string") return j.trans;
      return "";
    }
    for (var i = 0; i < j.length; i++) {
      var seg = j[i];
      if (typeof seg === "string") { parts.push(seg); }
      else if (Array.isArray(seg)) { if (typeof seg[0] === "string" && seg[0]) parts.push(seg[0]); }
      else if (seg && typeof seg === "object") {
        if (typeof seg.trans === "string") parts.push(seg.trans);
        else if (Array.isArray(seg.sentences)) {
          seg.sentences.forEach(function(s){ if (s && typeof s.trans === "string") parts.push(s.trans); });
        }
      }
    }
    return parts.join(" ").replace(/\s+/g, " ").trim();
  }

  function parseGtx(j){
    if (!Array.isArray(j) || !Array.isArray(j[0])) return "";
    var out = "";
    for (var i = 0; i < j[0].length; i++) {
      var s = j[0][i];
      if (Array.isArray(s) && typeof s[0] === "string") out += s[0];
    }
    return out.replace(/\s+/g, " ").trim();
  }

  function engineGoogle5(text, sl, tl){
    var url = "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=" +
      encodeURIComponent(sl) + "&tl=" + encodeURIComponent(tl) + "&q=" + encodeURIComponent(text);
    return fetchJSON(url, 8000).then(function(j){
      var r = parseGoogle5(j);
      if (!r) throw new Error("빈 응답");
      return r;
    });
  }

  function engineGoogleGtx(text, sl, tl){
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
      encodeURIComponent(sl) + "&tl=" + encodeURIComponent(tl) + "&dt=t&q=" + encodeURIComponent(text);
    return fetchJSON(url, 7000).then(function(j){
      var r = parseGtx(j);
      if (!r) throw new Error("빈 응답");
      return r;
    });
  }

  function engineMyMemory(text, sl, tl){
    if (sl === "auto") return Promise.reject(new Error("자동 감지 미지원"));
    if (text.length > 460) return Promise.reject(new Error("길이 초과"));
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent(sl + "|" + tl);
    return fetchJSON(url, 8000).then(function(j){
      var r = j && j.responseData && j.responseData.translatedText;
      if (!r) throw new Error("빈 응답");
      if (/^MYMEMORY WARNING/i.test(r)) throw new Error("한도 초과");
      if (/QUERY LENGTH LIMIT/i.test(r)) throw new Error("길이 초과");
      return String(r).trim();
    });
  }

  var ENGINES = [
    { name:"Google",       fn:engineGoogle5 },
    { name:"Google 보조",  fn:engineGoogleGtx },
    { name:"MyMemory",     fn:engineMyMemory }
  ];

  function translateText(text, sl, tl){
    var key = sl + "|" + tl + "|" + text;
    if (CACHE[key]) return Promise.resolve({ text:CACHE[key], engine:"캐시", ms:0 });
    var t0 = Date.now();
    function attempt(i){
      if (i >= ENGINES.length) return Promise.reject(new Error("모든 번역 엔진 실패"));
      var e = ENGINES[i];
      return e.fn(text, sl, tl).then(function(out){
        CACHE[key] = out;
        return { text:out, engine:e.name, ms:Date.now() - t0 };
      }).catch(function(err){
        if (i === ENGINES.length - 1) throw err;
        return attempt(i + 1);
      });
    }
    return attempt(0);
  }

  /* ══════════════ 번역 실행 ══════════════ */
  var lastSrc = "", lastDst = null, seq = 0;
  var debTimer = null;

  function runTranslate(raw){
    var text = String(raw == null ? inputEl.value : raw).trim();
    if (!text) {
      clearResult();
      return Promise.resolve(null);
    }
    lastSrc = text;
    var my = ++seq;
    setBadge("번역 중…", true);
    bigEl.classList.add("dim");
    return translateText(text, state.src, state.dst).then(function(res){
      if (my !== seq) return null;
      renderResult(res.text, res.engine, res.ms);
      addHistory(text, res.text, state.src, state.dst);
      if ($("autoSpeak").checked) speak(res.text, state.dst);
      return res;
    }).catch(function(err){
      if (my !== seq) return null;
      bigEl.classList.remove("dim");
      setBadge("번역 실패", false);
      var hint = "인터넷 연결을 확인해 주세요.";
      if (String(err && err.message).indexOf("timeout") >= 0) hint = "응답이 너무 늦어요. 잠시 뒤 다시 시도해 주세요.";
      toast("번역하지 못했어요 · " + hint);
      netDot.className = "netdot off";
      return null;
    });
  }

  function renderResult(text, engine, ms){
    phEl.hidden = true;
    bigEl.hidden = false;
    bigEl.classList.remove("dim");
    bigEl.textContent = text;
    lastDst = text;
    btnSpeak.disabled = false; btnCopy.disabled = false; btnFull.disabled = false;
    fsBig.textContent = text;
    fsLang.textContent = langName(state.dst);
    fitText();
    var sec = (ms / 1000).toFixed(ms < 1000 ? 2 : 1);
    setBadge(engine + " · " + sec + "초", false);
  }

  function clearResult(){
    phEl.hidden = false;
    bigEl.hidden = true;
    bigEl.textContent = "";
    lastDst = null;
    srcLine.hidden = true;
    setBadge("", false);
    btnSpeak.disabled = true; btnCopy.disabled = true; btnFull.disabled = true;
    seq++;
  }

  function updateSrcLine(){
    var t = inputEl.value.trim();
    if (!t) { if(!srcLine.hidden){ srcLine.hidden = true; fitText(); } return; }
    var wasHidden = srcLine.hidden;
    srcLine.hidden = false;
    srcLineText.textContent = t;
    if (wasHidden) fitText();
  }

  // 결과 영역에 꼭 맞는 가장 큰 글자 크기를 찾는다 (이진 탐색)
  function fitInto(el, box, maxSize, minSize, pad){
    if (!el || !el.textContent) return;
    var lo = minSize, hi = maxSize, best = minSize;
    var tries = 0;
    el.style.fontSize = hi + "px";
    while (tries++ < 9 && hi - lo > 1) {
      var mid = Math.round((lo + hi) / 2);
      el.style.fontSize = mid + "px";
      var fits = el.getBoundingClientRect().height <= box.clientHeight - pad;
      if (fits) { best = mid; lo = mid; } else { hi = mid; }
    }
    el.style.fontSize = best + "px";
  }

  function fitText(){
    if (!bigEl.textContent || bigEl.hidden) return;
    var maxSize = Math.max(30, Math.min(96, Math.round(resultBox.clientHeight * 0.6)));
    fitInto(bigEl, resultBox, maxSize, 15, 4);
    fitFsText();
  }

  function fitFsText(){
    if (!fsBig.textContent || !fs.classList.contains("open")) return;
    var maxSize = Math.max(34, Math.min(140, Math.round(window.innerHeight * 0.13)));
    fitInto(fsBig, fsBig.parentNode, maxSize, 15, 6);
  }

  window.addEventListener("resize", function(){ fitText(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function(){ fitText(); });
  }

  /* ══════════════ 입력 ══════════════ */
  function autosize(){
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(84, Math.max(44, inputEl.scrollHeight)) + "px";
  }
  inputEl.addEventListener("input", function(){

  $("btnGo").addEventListener("click", function(){

  /* ══════════════ 음성 인식 ══════════════ */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, heardFinal = "", micWatchdog = null, restartTimer = null;

  var ERR_MSG = {
    "not-allowed": "마이크 사용이 차단되어 있어요. 주소창 옆 자물쇠(⋮) → 마이크 → 허용으로 바꿔 주세요.",
    "service-not-allowed": "이 환경에서는 음성 인식 서비스가 막혀 있어요. 아래 안내를 참고해 주세요.",
    "audio-capture": "마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.",
    "network": "음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나, 키보드 마이크로 말해 보세요.",
    "no-speech": "소리가 들리지 않았어요. 마이크 가까이에서 다시 말해 주세요.",
    "aborted": "",
    "language-not-supported": "이 언어는 음성 인식을 지원하지 않아요. 출발 언어를 바꿔 보세요."
  };

  function micUnavailableHint(){
    showBanner("<b>이 브라우저에서는 음성 인식이 안 됩니다.</b><br>입력창을 누르고 <b>키보드의 🎤 버튼</b>으로 말하면 똑같이 번역돼요. (문자 입력만으로도 모든 기능이 동작합니다)");
  }

  function setListeningUI(on){
    listening = on;
    btnMic.setAttribute("aria-pressed", on ? "true" : "false");
    micIcon.textContent = on ? "■" : "🎤";
    micLabel.textContent = on ? "멈추기" : "말하기";
  }

  function stopListening(){
    setListeningUI(false);
    clearTimeout(micWatchdog);
    clearTimeout(restartTimer);
    if (rec) {
      try { rec.stop(); } catch(e) {}
      try { rec.abort(); } catch(e) {}
    }
    rec = null;
  }

  function startListening(){
    if (!SR) { micUnavailableHint(); return; }
    if (listening) { stopListening(); return; }

    heardFinal = inputEl.value.trim();
    if (heardFinal) heardFinal += " ";
    rec = new SR();
    rec.lang = bcp(state.src === "auto" ? "ko" : state.src);
    rec.interimResults = true;
    rec.continuous = true;
    rec.maxAlternatives = 1;

    var started = false;

    rec.onstart = function(){
      started = true;
      clearTimeout(micWatchdog);
      setListeningUI(true);
      setBadge("듣는 중…", true);
    };
    rec.onresult = function(e){
      clearTimeout(micWatchdog);
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) heardFinal += r[0].transcript + " ";
        else interim += r[0].transcript;
      }
      inputEl.value = (heardFinal + interim).replace(/\s+/g, " ").trim();
      autosize();
      updateSrcLine();
      if (heardFinal.trim()) runTranslate(heardFinal.trim());
    };
    rec.onerror = function(e){
      var code = e && e.error ? e.error : "unknown";
      if (code === "aborted") return;
      setListeningUI(false);
      clearTimeout(micWatchdog);
      if (code === "no-speech") { toast(ERR_MSG[code]); return; }
      if (code === "not-allowed" || code === "service-not-allowed") {
        showBanner("<b>음성 인식을 쓸 수 없어요.</b><br>" + (ERR_MSG[code] || "") +
          "<br>입력창을 누르고 <b>키보드의 🎤 버튼</b>으로 말하면 바로 번역됩니다.");
        toast("키보드 마이크로도 똑같이 쓸 수 있어요");
      } else if (code === "network") {
        showBanner("<b>음성 인식 서버 연결 실패.</b><br>파일을 <code>file://</code>로 열었다면 음성 인식이 막힐 수 있어요. " +
          "그때는 <b>입력창 + 키보드 🎤 버튼</b>을 쓰시면 문제없이 번역됩니다.");
        toast("키보드 마이크로 시도해 보세요");
      } else {
        toast("음성 인식 오류: " + code);
      }
    };
    rec.onend = function(){
      clearTimeout(micWatchdog);
      if (listening) {
        // 안드로이드에서 잠깐 끊기는 경우가 있어 자동 재시작
        restartTimer = setTimeout(function(){
          if (!listening) return;
          try { rec.start(); } catch(e) { setListeningUI(false); }
        }, 300);
      }
    };

    try {
      rec.start();
    } catch(e) {
      setListeningUI(false);
      showBanner("<b>음성 인식을 시작하지 못했어요.</b> 이 환경에서 인식이 막혀 있을 수 있어요. 입력창 + <b>키보드 🎤</b>로 말하면 바로 번역됩니다.");
      toast("키보드 마이크로도 똑같이 쓸 수 있어요");
      return;
    }
    setListeningUI(true);
    setBadge("마이크 연결 중…", true);

    // 응답이 없으면 멈추고 안내 (엔진이 없는 환경에서 조용히 멈추는 경우 대비)
    micWatchdog = setTimeout(function(){
      if (started) return;
      stopListening();
      setBadge("", false);
      showBanner("<b>음성 인식이 응답하지 않아요.</b><br>이 브라우저에서 인식 서비스가 막혀 있을 수 있어요. " +
        "<b>입력창 + 키보드 🎤 버튼</b>을 쓰면 바로 번역됩니다.");
      toast("키보드 마이크를 사용해 보세요");
    }, 7000);
  }

  btnMic.addEventListener("click", function(){
    if (!SR) { micUnavailableHint(); return; }
    startListening();
  });

  /* ══════════════ 읽어주기 (TTS) ══════════════ */
  var voicesReady = false;
  function loadVoices(){ try { if (window.speechSynthesis) window.speechSynthesis.getVoices(); } catch(e) {} }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.addEventListener("voiceschanged", function(){ voicesReady = true; loadVoices(); });
    setTimeout(function(){ voicesReady = true; }, 600);
  }

  function pickVoice(lang){
    var vs = [];
    try { vs = window.speechSynthesis.getVoices() || []; } catch(e) {}
    if (!vs.length) return null;
    var base = String(lang).split("-")[0].toLowerCase();
    var exact = null, loose = null;
    for (var i = 0; i < vs.length; i++) {
      var l = (vs[i].lang || "").replace("_", "-").toLowerCase();
      if (l === String(lang).toLowerCase()) { exact = vs[i]; break; }
      if (!loose && l.split("-")[0] === base) loose = vs[i];
    }
    return exact || loose || null;
  }

  function lsIsSpeaking(v){
    btnSpeak.textContent = v ? "■ 멈춤" : "🔊 읽기";
    $("fsSpeak").textContent = v ? "■ 멈춤" : "🔊 읽어주기";
  }

  function speak(text, langCode){
    if (!text) return;
    if (!("speechSynthesis" in window)) {
      toast("이 브라우저는 읽어주기를 지원하지 않아요");
      return;
    }
    var syn = window.speechSynthesis;
    if (syn.speaking) { syn.cancel(); lsIsSpeaking(false); return; }

    var u = new SpeechSynthesisUtterance(text);
    var lang = bcp(langCode);
    u.lang = lang;
    var v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = 0.95;
    u.pitch = 1;
    u.onstart = function(){ lsIsSpeaking(true); };
    u.onend = function(){ lsIsSpeaking(false); };
    u.onerror = function(){ lsIsSpeaking(false); };

    try {
      syn.cancel();
      syn.speak(u);
      lsIsSpeaking(true);
      // 음성 엔진이 없으면 조용히 아무 일도 일어나지 않으므로 안내
      setTimeout(function(){
        if (!syn.speaking && !syn.pending) {
          lsIsSpeaking(false);
          if (!pickVoice(lang)) toast("이 기기에 " + langName(langCode) + " 음성 엔진이 없어요 (설정 → TTS 설치)");
        }
      }, 1800);
    } catch(e) {
      lsIsSpeaking(false);
      toast("읽어주기를 시작하지 못했어요");
    }
  }

  btnSpeak.addEventListener("click", function(){ if (lastDst) speak(lastDst, state.dst); });
  $("fsSpeak").addEventListener("click", function(){ if (lastDst) speak(lastDst, state.dst); });

  /* ══════════════ 복사 ══════════════ */
  function copyText(text){
    function fallback(){
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.top = "-1000px";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        toast(ok ? "복사했어요" : "복사하지 못했어요");
      } catch(e) { toast("복사하지 못했어요"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast("복사했어요"); }).catch(fallback);
    } else fallback();
  }
  btnCopy.addEventListener("click", function(){ if (lastDst) copyText(lastDst); });
  $("fsCopy").addEventListener("click", function(){ if (lastDst) copyText(lastDst); });

  /* ══════════════ 전체화면 ══════════════ */
  function openFs(){
    if (!lastDst) return;
    fsBig.textContent = lastDst;
    fsLang.textContent = langName(state.dst);
    fs.classList.add("open");
    fitFsText();
    if (document.documentElement.requestFullscreen) {
      try {
        var p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function(){});
      } catch(e) {}
    }
  }
  function closeFs(){
    fs.classList.remove("open");
    if (document.fullscreenElement && document.exitFullscreen) {
      try { var p2 = document.exitFullscreen(); if (p2 && p2.catch) p2.catch(function(){}); } catch(e) {}
    }
  }
  btnFull.addEventListener("click", openFs);
  $("fsClose").addEventListener("click", closeFs);
  document.addEventListener("fullscreenchange", function(){
    if (!document.fullscreenElement && fs.classList.contains("open")) { /* 사용자가 나가면 그대로 둔다 */ }
  });

  /* ══════════════ 기록 ══════════════ */
  var history = [];
  try { history = JSON.parse(localStorage.getItem(HI_KEY) || "[]") || []; } catch(e) { history = []; }

  function saveHistory(){ try { localStorage.setItem(HI_KEY, JSON.stringify(history.slice(0, 40))); } catch(e) {} }

  function addHistory(src, dst, from, to){
    if (!src || !dst) return;
    if (history.length && history[0].src === src && history[0].dst === dst && history[0].to === to) return;
    var d = new Date();
    var hh = ("0" + d.getHours()).slice(-2), mm = ("0" + d.getMinutes()).slice(-2);
    history.unshift({ src:src, dst:dst, from:from, to:to, t:hh + ":" + mm });
    if (history.length > 40) history.length = 40;
    saveHistory();
    renderHistory();
  }

  function renderHistory(){
    histList.innerHTML = "";
    if (!history.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "아직 번역 기록이 없어요";
      li.style.background = "transparent";
      histList.appendChild(li);
      return;
    }
    history.forEach(function(h, idx){
      var li = document.createElement("li");
      var box = document.createElement("div");
      box.className = "htext";
      var s = document.createElement("p"); s.className = "hsrc"; s.textContent = h.src;
      var d = document.createElement("p"); d.className = "hdst"; d.textContent = h.dst;
      var m = document.createElement("div"); m.className = "hmeta";
      m.textContent = langName(h.from) + " → " + langName(h.to) + " · " + (h.t || "");
      box.appendChild(s); box.appendChild(d); box.appendChild(m);
      var del = document.createElement("button");
      del.className = "hdel"; del.textContent = "✕"; del.setAttribute("aria-label", "이 기록 삭제");
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        history.splice(idx, 1); saveHistory(); renderHistory();
      });
      li.appendChild(box); li.appendChild(del);
      li.addEventListener("click", function(){
        inputEl.value = h.src; autosize(); updateSrcLine();
        if (state.src !== h.from) { state.src = h.from; srcSel.value = h.from; }
        if (state.dst !== h.to) { state.dst = h.to; dstSel.value = h.to; }
        saveState();
        closeSheets();
        runTranslate(h.src);
      });
      histList.appendChild(li);
    });
  }

  /* ══════════════ 시트 ══════════════ */
  function openSheet(el){
    closeSheets();
    renderHistory();
    backdrop.classList.add("open");
    el.classList.add("open");
  }
  function closeSheets(){
    backdrop.classList.remove("open");
    histSheet.classList.remove("open");
    diagSheet.classList.remove("open");
  }
  $("btnHistory").addEventListener("click", function(){ openSheet(histSheet); });
  $("histClose").addEventListener("click", closeSheets);
  $("histClear").addEventListener("click", function(){
    history = []; saveHistory(); renderHistory(); toast("기록을 지웠어요");
  });
  $("btnDiag").addEventListener("click", function(){ openSheet(diagSheet); renderDiag(); });
  $("diagClose").addEventListener("click", closeSheets);
  backdrop.addEventListener("click", closeSheets);

  /* ══════════════ 진단 ══════════════ */
  function row(k, v, cls){
    var d = document.createElement("div");
    d.className = "drow";
    var kk = document.createElement("span"); kk.className = "k"; kk.textContent = k;
    var vv = document.createElement("span"); vv.className = "v " + (cls || ""); vv.textContent = v;
    d.appendChild(kk); d.appendChild(vv);
    return d;
  }

  function renderDiag(){
    diagList.innerHTML = "";
    var isFile = location.protocol === "file:";
    diagList.appendChild(row("주소 방식", isFile ? "file:// (내 파일)" : location.protocol.replace(":", ""), isFile ? "mid" : "ok"));
    diagList.appendChild(row("보안 컨텍스트", window.isSecureContext ? "예" : "아니오", window.isSecureContext ? "ok" : "no"));
    diagList.appendChild(row("음성 인식 기능", SR ? "있음" : "없음", SR ? "ok" : "no"));
    diagList.appendChild(row("읽어주기(TTS)", ("speechSynthesis" in window) ? "가능" : "불가", ("speechSynthesis" in window) ? "ok" : "no"));

    var rowPerm = document.createElement("div");
    rowPerm.className = "drow";
    var kk = document.createElement("span"); kk.className = "k"; kk.textContent = "마이크 권한";
    var vv = document.createElement("span"); vv.className = "v"; vv.textContent = "확인 중…";
    rowPerm.appendChild(kk); rowPerm.appendChild(vv);
    diagList.appendChild(rowPerm);

    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name:"microphone" }).then(function(p){
        var st = p.state;
        vv.textContent = st === "granted" ? "허용됨" : (st === "denied" ? "차단됨" : "물어봄(미결정)");
        vv.className = "v " + (st === "granted" ? "ok" : (st === "denied" ? "no" : "mid"));
      }).catch(function(){ vv.textContent = "알 수 없음"; vv.className = "v mid"; });
    } else {
      vv.textContent = "확인 불가"; vv.className = "v mid";
    }

    var vc = 0;
    try { vc = (window.speechSynthesis.getVoices() || []).length; } catch(e) {}
    diagList.appendChild(row("읽어주기 음성 수", vc ? vc + "개" : "없음(설정에서 설치)", vc ? "ok" : "mid"));
    diagList.appendChild(row("번역 엔진", "Google + MyMemory 예비", "ok"));
  }

  var dTestRow = null;
  $("diagRun").addEventListener("click", function(){
    var btn = this;
    btn.disabled = true; btn.textContent = "테스트 중…";
    if (dTestRow && dTestRow.parentNode) dTestRow.parentNode.removeChild(dTestRow);
    diagList.appendChild(row("연결 테스트", "진행 중…", "mid"));
    var mine = diagList.lastChild;
    var sample = state.src === "en" ? "Hello" : "안녕하세요";
    var sl = state.src === "auto" ? "ko" : state.src;
    var results = [];
    var chain = [];
    ENGINES.forEach(function(e){
      chain.push(e.fn(sample, sl, "en").then(function(){
        results.push(e.name + " ✓");
      }).catch(function(){ results.push(e.name + " ✗"); }));
    });
    Promise.all(chain).then(function(){
      var ok = results.some(function(r){ return r.indexOf("✓") >= 0; });
      mine.lastChild.textContent = results.join(" / ");
      mine.lastChild.className = "v " + (ok ? "ok" : "no");
      btn.disabled = false; btn.textContent = "다시 테스트";
      netDot.className = "netdot " + (ok ? "on" : "off");
    });
  });

  /* ══════════════ 안내 배너 ══════════════ */
  function showFirstBanner(){
    var isFile = location.protocol === "file:";
    var dismissed = false;
    try { dismissed = localStorage.getItem(BN_KEY) === "1"; } catch(e) {}
    if (dismissed) return;
    if (!SR) {
      showBanner("<b>이 브라우저에는 음성 인식이 없어요.</b> 입력창 + <b>키보드 🎤</b>로 말하면 똑같이 번역됩니다.");
      return;
    }
    if (isFile) {
      showBanner("📄 <b>파일(file://)로 열었어요.</b> 음성 인식이 막히면 입력창 + <b>키보드 🎤</b>로 말하세요. 모든 기능은 그대로 동작합니다.");
    }
  }
  $("bannerClose").addEventListener("click", function(){
    bannerEl.hidden = true;
    try { localStorage.setItem(BN_KEY, "1"); } catch(e) {}
  });

  /* ══════════════ 네트워크 표시 ══════════════ */
  function updateNet(){
    netDot.className = "netdot " + (navigator.onLine ? "on" : "off");
    if (!navigator.onLine) toast("인터넷 연결이 끊겨 있어요");
  }
  window.addEventListener("online", updateNet);
  window.addEventListener("offline", updateNet);

  /* ══════════════ 초기화 ══════════════ */
  fillSelects();
  applyTheme();
  renderHistory();
  updateNet();
  $("autoSpeak").checked = !!state.autoSpeak;
  $("autoSpeak").addEventListener("change", function(){
    state.autoSpeak = $("autoSpeak").checked; saveState();
  });
  autosize();
  showFirstBanner();

  // 첫 진입 시 엔진 상태를 조용히 확인 (실패해도 조용히)
  setTimeout(function(){
    if (!navigator.onLine) return;
    engineGoogle5("안녕하세요", "ko", state.dst).then(function(){
      netDot.className = "netdot on";
    }).catch(function(){
      engineMyMemory("안녕하세요", "ko", state.dst).then(function(){
        netDot.className = "netdot on";
      }).catch(function(){ netDot.className = "netdot off"; });
    });
  }, 1200);
})();
</script>
</body>
</html>
