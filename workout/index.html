<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>홈트 루틴 5종 — 기본 체력 · 스탠딩 뱃살</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#07090c;
    --bg-glow:#121a24;
    --fg:#eff5fb;
    --dim:#8b98a9;
    --line:rgba(255,255,255,.09);
    --panel:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
    --btn:#1b232d;
    --btn-hi:#263141;
    --accent:#3be08c;
    --accent-ink:#03150c;
    --accent-dim:rgba(59,224,140,.16);
    --rest:#ffb648;
    --rest-dim:rgba(255,182,72,.14);
    --ready:#5b8dff;
    --ready-dim:rgba(91,141,255,.14);
    --danger:#ff6b6b;
    --shadow:0 12px 34px rgba(0,0,0,.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:radial-gradient(130% 70% at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--fg);
    font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  button{ font-family:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden{ display:none !important; }

  #app{
    min-height:100%;
    display:flex; flex-direction:column;
    max-width:560px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 14px);
  }
  body.running #app{
    height:100dvh; max-height:100dvh;
    padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
    overflow:hidden;
  }

  /* ── header ── */
  .bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:2px 2px 8px;
  }
  .brand{ font-weight:800; font-size:16.5px; letter-spacing:-.02em; }
  .bar-actions{ display:flex; align-items:center; gap:6px; }
  .chip{
    font-size:11px; color:var(--dim);
    border:1px solid var(--line); border-radius:999px;
    padding:4px 9px; background:var(--panel);
  }
  .chip.on{ color:var(--accent); border-color:rgba(59,224,140,.4); background:var(--accent-dim); }
  .iconbtn{
    width:38px; height:38px; border-radius:12px;
    display:grid; place-items:center; font-size:16px;
    background:var(--btn); border:1px solid var(--line);
  }
  .iconbtn:active{ background:var(--btn-hi); }

  /* ── routine tabs ── */
  .tabs{
    flex:0 0 auto; display:flex; gap:7px;
    padding:0 2px 8px;
  }
  .tab{
    flex:1 1 0; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:5px;
    padding:9px 6px; border-radius:13px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--dim); font-size:12.5px; font-weight:800; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tab .ic{ font-size:13.5px; line-height:1; }
  .tab.on{
    color:var(--accent);
    border-color:rgba(59,224,140,.45);
    background:var(--accent-dim);
    box-shadow:0 4px 16px rgba(59,224,140,.10);
  }
  .tab.on.st{ color:#ff8a5b; border-color:rgba(255,120,60,.45); background:rgba(255,120,60,.14); box-shadow:0 4px 16px rgba(255,120,60,.10); }
  body.running .tabs{ display:none; }

  /* ── stage ── */
  .stage-wrap{ flex:0 0 auto; }
  .stage{
    position:relative;
    border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid var(--line);
  }
  .stage svg{ display:block; width:100%; height:auto; }
  .stage .tag{
    position:absolute; top:8px; left:8px;
    font-size:11px; font-weight:700; letter-spacing:.02em;
    color:var(--accent); background:rgba(4,14,9,.55);
    border:1px solid rgba(59,224,140,.35);
    padding:3px 9px; border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .stage .tag.rest{ color:var(--rest); border-color:rgba(255,182,72,.4); background:rgba(20,12,2,.55); }
  .stage-info{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    padding:8px 4px 2px;
  }
  #exTitle{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
  #exMuscle{ font-size:11.5px; color:var(--accent); font-weight:700; }
  #exTip{ width:100%; font-size:12.5px; color:var(--dim); line-height:1.45; }

  /* ── timer ── */
  .timer-wrap{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:6px 0; }
  .ring-wrap{ position:relative; width:min(62vw, 34dvh, 240px); aspect-ratio:1; }
  .ring{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:9; stroke-linecap:round; }
  .ring .bg{ stroke:rgba(255,255,255,.09); }
  .ring #ringFg{ stroke:var(--accent); transition:stroke .3s; }
  body.phase-rest #ringFg{ stroke:var(--rest); }
  body.phase-ready #ringFg{ stroke:var(--ready); }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  #phaseLabel{ font-size:12.5px; font-weight:800; letter-spacing:.14em; color:var(--dim); }
  body.phase-rest #phaseLabel{ color:var(--rest); }
  body.phase-ready #phaseLabel{ color:var(--ready); }
  #bigNum{
    font-size:clamp(52px, 19dvh, 84px); font-weight:800; line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  }
  #subLabel{ font-size:11.5px; color:var(--dim); }

  .controls{ display:flex; gap:8px; width:100%; max-width:420px; }
  .btn{
    flex:1; padding:13px 8px; border-radius:14px;
    font-size:14.5px; font-weight:800; letter-spacing:-.01em;
    background:var(--btn); border:1px solid var(--line);
    color:var(--fg);
  }
  .btn:active{ background:var(--btn-hi); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; box-shadow:0 6px 20px rgba(59,224,140,.25); }
  .btn.primary.pause{ background:var(--rest); color:#1d1200; box-shadow:0 6px 20px rgba(255,182,72,.22); }
  .btn:disabled{ opacity:.38; pointer-events:none; }
  .btn.slim{ flex:0 0 auto; padding:13px 14px; }

  /* ── exercise list ── */
  .list{ flex:0 0 auto; display:flex; flex-direction:column; gap:7px; padding-top:4px; }
  .exrow{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:15px;
    background:var(--panel); border:1px solid var(--line);
  }
  .exrow.sel{ border-color:rgba(59,224,140,.45); background:var(--accent-dim); }
  .exrow .no{
    flex:0 0 auto; width:26px; height:26px; border-radius:9px;
    display:grid; place-items:center;
    font-size:12.5px; font-weight:800;
    background:var(--btn); color:var(--dim);
  }
  .exrow.sel .no{ background:var(--accent); color:var(--accent-ink); }
  .exrow .nm{ flex:1 1 auto; min-width:0; }
  .exrow .nm b{ display:block; font-size:14.5px; letter-spacing:-.01em; }
  .exrow .nm span{ display:block; font-size:11px; color:var(--dim); margin-top:1px; }
  .stepper{ flex:0 0 auto; display:flex; align-items:center; gap:2px; }
  .stepper button{
    width:30px; height:30px; border-radius:10px; font-size:15px; font-weight:800;
    background:var(--btn); border:1px solid var(--line); color:var(--fg);
  }
  .stepper .val{ min-width:44px; text-align:center; font-size:13.5px; font-weight:800; font-variant-numeric:tabular-nums; }
  .exrow .play{
    flex:0 0 auto; width:36px; height:36px; border-radius:12px;
    display:grid; place-items:center; font-size:14px;
    background:var(--accent); color:var(--accent-ink); font-weight:800;
  }

  /* ── options ── */
  .opts{ flex:0 0 auto; display:flex; gap:8px; padding-top:10px; }
  .opt{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px 6px; border-radius:14px;
    background:var(--panel); border:1px solid var(--line);
    font-size:12.5px; color:var(--dim);
  }
  .opt b{ color:var(--fg); font-size:13.5px; }
  .opt button{
    min-width:30px; height:30px; padding:0 8px; border-radius:10px;
    background:var(--btn); border:1px solid var(--line); font-size:13px; font-weight:800;
  }
  .setbtn.on{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }

  .rec{
    flex:0 0 auto; margin-top:10px; padding:10px 14px; border-radius:14px;
    background:var(--panel); border:1px solid var(--line);
    font-size:12.5px; color:var(--dim); text-align:center; line-height:1.5;
  }
  .rec b{ color:var(--accent); }
  .foot{ flex:0 0 auto; padding:10px 4px 0; font-size:11px; color:#4d5461; text-align:center; line-height:1.6; }

  /* running: focus on the session */
  body.running .list, body.running .opts, body.running .rec, body.running .foot{ display:none; }
  body.running .stage-info{ padding-bottom:0; }
  body.running #exTip{ font-size:12px; }

  /* ── landscape ── */
  @media (orientation:landscape) and (min-width:600px){
    body.running #app{
      max-width:980px;
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
      grid-template-rows:auto 1fr;
      column-gap:18px;
    }
    body.running .bar{ grid-column:1 / -1; }
    body.running .stage-wrap{ grid-column:1; grid-row:2; display:flex; flex-direction:column; min-height:0; }
    body.running .stage{ flex:1; min-height:0; display:flex; align-items:center; }
    body.running .stage svg{ height:100%; width:auto; max-width:100%; margin:0 auto; }
    body.running .timer-wrap{ grid-column:2; grid-row:2; }
    .ring-wrap{ width:min(46dvh, 230px); }
    #bigNum{ font-size:clamp(40px, 15.5dvh, 76px); }
    #subLabel{ font-size:10.5px; }
    #phaseLabel{ font-size:11px; }
  }
  @media (min-width:600px) and (orientation:portrait){
    #app{ max-width:520px; }
  }

  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 76px);
    transform:translateX(-50%) translateY(20px);
    background:#eaf2fb; color:#0b1118;
    font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    max-width:86vw; text-align:center;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .noscript-note{ padding:30px 16px; text-align:center; color:var(--dim); font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<noscript><div class="noscript-note">이 앱은 동작 타이머와 시범 애니메이션을 위해 JavaScript가 필요합니다.<br />브라우저 설정에서 JavaScript를 켜 주세요.</div></noscript>

<div id="app">
  <header class="bar">
    <div class="brand" id="brand">🏋️ 홈트 루틴</div>
    <div class="bar-actions">
      <span class="chip" id="wakeChip">화면 유지</span>
      <button class="iconbtn" id="soundBtn" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>
  </header>

  <nav class="tabs" id="routineTabs" aria-label="운동 루틴 선택">
    <button class="tab on" id="tabBasic" type="button" data-routine="basic" aria-pressed="true"><span class="ic">💪</span>기본 체력 5종</button>
    <button class="tab st" id="tabStanding" type="button" data-routine="standing" aria-pressed="false"><span class="ic">🔥</span>스탠딩 뱃살 5종</button>
  </nav>

  <section class="stage-wrap">
    <div class="stage" id="stage">
      <svg id="demoSvg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-label="운동 시범 애니메이션"></svg>
      <span class="tag" id="stageTag">시범</span>
    </div>
    <div class="stage-info">
      <span id="exTitle">스쿼트</span>
      <span id="exMuscle">하체·코어</span>
      <span id="exTip"></span>
    </div>
  </section>

  <section class="timer-wrap">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="bg" cx="100" cy="100" r="88"></circle>
        <circle id="ringFg" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="ring-center">
        <div id="phaseLabel">준비</div>
        <div id="bigNum">40</div>
        <div id="subLabel"></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="startBtn" type="button">▶ 전체 시작</button>
      <button class="btn slim" id="skipBtn" type="button">건너뛰기</button>
      <button class="btn slim" id="resetBtn" type="button">초기화</button>
    </div>
  </section>

  <section class="list" id="exList"></section>

  <section class="opts">
    <div class="opt" id="setOpt">
      <span>세트</span>
      <button class="setbtn on" type="button" data-sets="1">1</button>
      <button class="setbtn" type="button" data-sets="2">2</button>
      <button class="setbtn" type="button" data-sets="3">3</button>
    </div>
    <div class="opt">
      <span>휴식</span>
      <button id="restMinus" type="button">−</button>
      <b id="restVal">15초</b>
      <button id="restPlus" type="button">+</button>
    </div>
  </section>

  <div class="rec" id="todayRec"></div>
  <div class="foot">운동 전 가볍게 몸을 풀고, 통증이 느껴지면 바로 멈추세요.<br />전문의 진단·처방을 대신하지 않습니다.</div>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ══════════ 운동 데이터 — 루틴 2종 × 5가지 ══════════ */
var ROUTINES = [
  { id:'basic', name:'기본 체력 5종', icon:'💪', ex:[
    { id:'squat',  name:'스쿼트',       en:'Squat',             muscle:'하체·코어',   tip:'발 어깨너비, 엉덩이를 뒤로 빼며 앉으세요',                          def:40, cycle:2.0 },
    { id:'pushup', name:'푸시업',       en:'Push-up',           muscle:'가슴·팔·어깨', tip:'몸을 일직선으로 유지하세요 (힘들면 무릎 대고 진행)',                  def:30, cycle:2.0 },
    { id:'plank',  name:'플랭크',       en:'Plank',             muscle:'코어·허리',   tip:'팔꿈치로 버티며 배·엉덩이에 힘, 허리가 꺾이지 않게 하세요',            def:40, cycle:3.2 },
    { id:'lunge',  name:'런지',         en:'Alternating Lunge', muscle:'하체 균형·둔근', tip:'번갈아 한 발 앞으로 내딛고 앞 무릎이 90도가 되게 하세요',            def:40, cycle:3.6 },
    { id:'jacks',  name:'팔벌려뛰기',   en:'Jumping Jacks',     muscle:'전신 유산소', tip:'리듬감 있게 팔·다리를 벌리세요 (무릎 부담 시 한 발씩 옆으로 스텝)',     def:45, cycle:1.3 }
  ]},
  { id:'standing', name:'스탠딩 뱃살 5종', icon:'🔥', ex:[
    { id:'kniup',   name:'스탠딩 니업 언더클랩', en:'', muscle:'아랫배', tip:'무릎을 가슴 높이로 번갈아 들며, 무릎 아래에서 양손을 마주쳐 박수',   def:40, cycle:1.7 },
    { id:'bicycle', name:'스탠딩 바이시클 크런치', en:'', muscle:'옆구리', tip:'손은 머리 뒤, 몸통을 비틀어 팔꿈치와 반대쪽 무릎을 가까이 붙이세요', def:40, cycle:1.9 },
    { id:'ovknee',  name:'스탠딩 오버헤드 암 다운 니업', en:'', muscle:'윗배', tip:'머리 위 깍지 낀 손을 무릎 쪽으로 내려 터치하고 다시 올리세요',   def:40, cycle:1.9 },
    { id:'toetouch',name:'스탠딩 토 터치', en:'', muscle:'전신·하체·코어', tip:'다리를 앞위로 쭉 펴 차올려 반대 손으로 발끝을 터치하세요',      def:40, cycle:1.9 },
    { id:'sidebend',name:'스탠딩 맨몸 사이드 밴드', en:'', muscle:'허리·측면 복사근', tip:'한 손은 골반, 반대팔은 머리 위로 넘겨 옆구리를 길게 늘여주세요', def:40, cycle:2.6 }
  ]}
];
var REST_DEF = 15, REST_MIN = 5, REST_MAX = 60;
var EX_MIN = 10, EX_MAX = 120, EX_STEP = 5;
var READY_SEC = 3;

/* ══════════ 포즈 수학 (2분절 IK 막대 인형) ══════════ */
var G = 250;                                    // 모델 좌표계 ground y
var L = { thigh:52, shin:52, torso:62, upper:40, fore:38, headR:16 };
var DEG = Math.PI/180;
function dn(o,a,r){ return {x:o.x + Math.sin(a*DEG)*r, y:o.y + Math.cos(a*DEG)*r}; }
function up(o,lean,r){ return {x:o.x + Math.sin(lean*DEG)*r, y:o.y - Math.cos(lean*DEG)*r}; }
function ik(a,b,l1,l2,pick){                    // pick: 'x+'|'x-'|'y+'|'y-' — 관절이 휘는 방향
  var dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1e-6;
  var dd=Math.min(d, l1+l2-0.4); dd=Math.max(dd, Math.abs(l1-l2)+0.4);
  var A=(l1*l1-l2*l2+dd*dd)/(2*dd), h=Math.sqrt(Math.max(0,l1*l1-A*A));
  var ux=dx/d, uy=dy/d, px=a.x+ux*A, py=a.y+uy*A;
  var c1={x:px+uy*h, y:py-ux*h}, c2={x:px-uy*h, y:py+ux*h};
  var k=pick.charAt(0), s=(pick.charAt(1)==='+')?1:-1;
  return (k==='x') ? (c1.x*s>c2.x*s?c1:c2) : (c1.y*s>c2.y*s?c1:c2);
}
function smooth(t){ t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); }
function pulse(u){ return (1-Math.cos(2*Math.PI*u))/2; }

var POSES = {};

/* 1. 스쿼트 — 측면 */
POSES.squat = function(u){
  var s = pulse(u);
  var hip = {x:200-14*s, y:146+50*s};
  var lean = 6 + 26*s;
  var sh = up(hip, lean, L.torso);
  var head = up(sh, lean, 29);
  var ankN = {x:207, y:G}, ankF = {x:197, y:G};
  var knN = ik(hip, ankN, L.thigh, L.shin, 'x+');
  var knF = ik({x:hip.x-6,y:hip.y}, ankF, L.thigh, L.shin, 'x+');
  var aU = 8 + 80*s, aF = aU - 12*s;
  var elb = dn({x:sh.x+7,y:sh.y}, aU, L.upper);
  var hand = dn(elb, aF, L.fore);
  return {
    head:head, torso:[hip,sh],
    legs:[{a:{x:hip.x-6,y:hip.y},b:knF,c:ankF,far:true},{a:hip,b:knN,c:ankN}],
    arms:[{a:{x:sh.x-4,y:sh.y},b:{x:elb.x-6,y:elb.y},c:{x:hand.x-6,y:hand.y},far:true},{a:{x:sh.x+7,y:sh.y},b:elb,c:hand}],
    hands:[{x:hand.x-6,y:hand.y,far:true},{x:hand.x,y:hand.y}],
    feet:[{a:ankF,b:{x:ankF.x+15,y:G},far:true},{a:ankN,b:{x:ankN.x+15,y:G}}]
  };
};

/* 2. 푸시업 — 측면 */
POSES.pushup = function(u){
  var s = pulse(u);
  var toe = {x:150, y:G};
  var bodyLen = L.thigh + L.shin + L.torso;
  var ang = (28 - 12*s)*DEG;
  var sh = {x: toe.x + Math.cos(ang)*bodyLen, y: toe.y - Math.sin(ang)*bodyLen};
  var ux = Math.cos(ang), uy = -Math.sin(ang);
  var hip = {x: toe.x + ux*104, y: toe.y + uy*104};
  var kn  = {x: toe.x + ux*52,  y: toe.y + uy*52};
  var head = {x: sh.x + ux*26, y: sh.y + uy*26 + 3};
  var hand = {x:298, y:G};
  var elb = ik(sh, hand, L.upper, L.fore, 'x-');
  return {
    head:head, torso:[hip,sh],
    legs:[{a:{x:hip.x-5,y:hip.y-1},b:{x:kn.x-5,y:kn.y-1},c:{x:toe.x-5,y:toe.y},far:true},{a:hip,b:kn,c:toe}],
    arms:[{a:{x:sh.x-5,y:sh.y},b:{x:elb.x-5,y:elb.y},c:{x:hand.x-5,y:hand.y},far:true},{a:sh,b:elb,c:hand}],
    hands:[{x:hand.x-5,y:hand.y,far:true},{x:hand.x,y:hand.y}],
    feet:[{a:toe,b:{x:toe.x-14,y:G}}]
  };
};

/* 3. 플랭크 — 측면 (버티며 호흡) */
POSES.plank = function(u){
  var br = Math.sin(2*Math.PI*u);
  var sh = {x:288, y:G-40 + br*1.4};
  var bodyLen = L.thigh + L.shin + L.torso;
  var ang = Math.asin((G-sh.y)/bodyLen);
  var toe = {x: sh.x - Math.cos(ang)*bodyLen, y: G};
  var ux = Math.cos(ang), uy = -Math.sin(ang);
  var hip = {x: toe.x + ux*104, y: toe.y + uy*104 + br*0.8};
  var kn  = {x: toe.x + ux*52,  y: toe.y + uy*52};
  var head = {x: sh.x + ux*25, y: sh.y + uy*25 + 4};
  var elb = {x: sh.x + 1, y: G-3};
  var hand = {x: sh.x + 34, y: G-3};
  return {
    head:head, torso:[hip,sh],
    legs:[{a:{x:hip.x-5,y:hip.y},b:{x:kn.x-5,y:kn.y},c:{x:toe.x-5,y:toe.y},far:true},{a:hip,b:kn,c:toe}],
    arms:[{a:{x:sh.x-5,y:sh.y},b:{x:elb.x-5,y:elb.y},c:{x:hand.x-5,y:hand.y},far:true},{a:sh,b:elb,c:hand}],
    hands:[{x:hand.x-5,y:hand.y,far:true},{x:hand.x,y:hand.y}],
    feet:[{a:toe,b:{x:toe.x-14,y:G}}]
  };
};

/* 4. 런지 — 측면, 좌우 번갈아 */
POSES.lunge = function(u){
  var half = (u*2)%1;
  var frontRight = u < 0.5;
  var step = smooth(Math.min(1, half/0.2)) * (half < 0.8 ? 1 : smooth((1-half)/0.2));
  // 하강 깊이: 발을 내딛은 뒤 가라앉고, 발을 회수하기 전에 일어섬 (도달 범위 내 유지)
  var rise = smooth(Math.min(1, Math.max(0, (half-0.04)/0.32)));
  var fall = smooth(Math.min(1, Math.max(0, (0.96-half)/0.32)));
  var s = rise*fall;
  var hip = {x:200+10*s, y:146+30*s};
  var lean = 4 + 12*s;
  var sh = up(hip, lean, L.torso);
  var head = up(sh, lean, 29);
  var fA = {x:200+56*step, y:G};
  var bA = {x:200-36*step, y:G-12*step};
  var fK = ik(hip, fA, L.thigh, L.shin, 'x+');
  var bK = ik({x:hip.x-3,y:hip.y}, bA, L.thigh, L.shin, 'x+');
  var aU = -16, aF = 70;
  var elb = dn({x:sh.x+6,y:sh.y}, aU, L.upper);
  var hand = dn(elb, aF, L.fore);
  var near = frontRight ? {a:hip,b:fK,c:fA} : {a:hip,b:bK,c:bA};
  var far  = frontRight ? {a:{x:hip.x-6,y:hip.y},b:{x:bK.x-6,y:bK.y},c:{x:bA.x-6,y:bA.y}}
                        : {a:{x:hip.x-6,y:hip.y},b:{x:fK.x-6,y:fK.y},c:{x:fA.x-6,y:fA.y}};
  return {
    head:head, torso:[hip,sh],
    legs:[{a:far.a,b:far.b,c:far.c,far:true},{a:near.a,b:near.b,c:near.c}],
    arms:[{a:{x:sh.x-4,y:sh.y},b:{x:elb.x-6,y:elb.y},c:{x:hand.x-6,y:hand.y},far:true},{a:{x:sh.x+6,y:sh.y},b:elb,c:hand}],
    hands:[{x:hand.x-6,y:hand.y,far:true},{x:hand.x,y:hand.y}],
    feet:[{a:fA,b:{x:fA.x+15,y:G}},{a:bA,b:{x:bA.x+15,y:G}}]
  };
};

/* 5. 팔벌려뛰기 — 정면 */
POSES.jacks = function(u){
  var o = pulse(u);
  var hop = 8*o;
  var ax = 13 + 34*o;
  var aN = {x:200+ax, y:G-2-hop};
  var aF = {x:200-ax, y:G-2-hop};
  var drop = Math.sqrt(Math.max(0, 104*104 - ax*ax));
  var hip = {x:200, y:G-2-hop-drop};
  var sh  = {x:200, y:hip.y-60};
  var head= {x:200, y:sh.y-29};
  var kN = ik(hip, aN, L.thigh, L.shin, 'x+');
  var kF = ik(hip, aF, L.thigh, L.shin, 'x-');
  var shN = {x:200+19, y:sh.y+4}, shF = {x:200-19, y:sh.y+4};
  var armA = Math.PI*o;
  var hN = {x:shN.x + Math.sin(armA)*76, y:shN.y + Math.cos(armA)*76};
  var hF = {x:shF.x - Math.sin(armA)*76, y:shF.y + Math.cos(armA)*76};
  var eN = ik(shN, hN, L.upper, L.fore, 'x+');
  var eF = ik(shF, hF, L.upper, L.fore, 'x-');
  return {
    head:head, torso:[hip,sh],
    legs:[{a:{x:hip.x-6,y:hip.y},b:{x:kF.x-4,y:kF.y},c:aF,far:true},{a:hip,b:kN,c:aN}],
    arms:[{a:{x:shF.x-3,y:shF.y},b:{x:eF.x-4,y:eF.y},c:{x:hF.x-4,y:hF.y},far:true},{a:shN,b:eN,c:hN}],
    hands:[{x:hF.x-4,y:hF.y,far:true},{x:hN.x,y:hN.y}],
    feet:[{a:aF,b:{x:aF.x-12,y:G-2-hop},far:true},{a:aN,b:{x:aN.x+12,y:G-2-hop}}]
  };
};

/* ══════════ 스탠딩 뱃살 5종 포즈 (2분절 IK, 정면·사선·측면) ══════════ */
function sMix(a,b,t){ return a+(b-a)*t; }
function sClamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function sArm(sh, target, pick){                 /* 팔 IK: 관절 길이를 넘지 않게 손을 FK로 확정 */
  var dx=target.x-sh.x, dy=target.y-sh.y, d=Math.sqrt(dx*dx+dy*dy)||1e-6;
  var lo=Math.abs(L.upper-L.fore)+0.4, hi=L.upper+L.fore-0.4;
  var dd=sClamp(d, lo, hi);
  var A=(L.upper*L.upper - L.fore*L.fore + dd*dd)/(2*dd);
  var h=Math.sqrt(Math.max(0,L.upper*L.upper-A*A));
  var ux=dx/d, uy=dy/d, px=sh.x+ux*A, py=sh.y+uy*A;
  var c1={x:px+uy*h,y:py-ux*h}, c2={x:px-uy*h,y:py+ux*h};
  var k=pick.charAt(0), sg=(pick.charAt(1)==='+')?1:-1;
  var elb=(k==='x') ? (c1.x*sg>c2.x*sg?c1:c2) : (c1.y*sg>c2.y*sg?c1:c2);
  var ex=target.x-elb.x, ey=target.y-elb.y, ed=Math.sqrt(ex*ex+ey*ey)||1e-6;
  return {elbow:elb, hand:{x:elb.x+ex/ed*L.fore, y:elb.y+ey/ed*L.fore}};
}
function sLeg(hip, target, pick){                /* 다리 IK: 골반→발목 */
  var dx=target.x-hip.x, dy=target.y-hip.y, d=Math.sqrt(dx*dx+dy*dy)||1e-6;
  var lo=Math.abs(L.thigh-L.shin)+0.4, hi=L.thigh+L.shin-0.4;
  var dd=sClamp(d, lo, hi);
  var A=(L.thigh*L.thigh - L.shin*L.shin + dd*dd)/(2*dd);
  var h=Math.sqrt(Math.max(0,L.thigh*L.thigh-A*A));
  var ux=dx/d, uy=dy/d, px=hip.x+ux*A, py=hip.y+uy*A;
  var c1={x:px+uy*h,y:py-ux*h}, c2={x:px-uy*h,y:py+ux*h};
  var k=pick.charAt(0), sg=(pick.charAt(1)==='+')?1:-1;
  var kn=(k==='x') ? (c1.x*sg>c2.x*sg?c1:c2) : (c1.y*sg>c2.y*sg?c1:c2);
  var ex=target.x-kn.x, ey=target.y-kn.y, ed=Math.sqrt(ex*ex+ey*ey)||1e-6;
  return {knee:kn, ankle:{x:kn.x+ex/ed*L.shin, y:kn.y+ey/ed*L.shin}};
}
function sKneeLeg(side, lift, out, kneeH, shinOut){   /* 서 있는 자세 ↔ 무릎 든 자세 보간 */
  var hipX = 200 + side*7;
  var upKn = {x: 200 + side*out, y: 146 - kneeH*lift};
  var upAk = {x: upKn.x + side*shinOut, y: upKn.y + L.shin - 6*lift};
  return {a:{x:hipX, y:146},
          b:{x:sMix(200+side*11, upKn.x, lift), y:sMix(198, upKn.y, lift)},
          c:{x:sMix(200+side*17, upAk.x, lift), y:sMix(G, upAk.y, lift)},
          foot:{x:sMix(200+side*17+11, upAk.x - side*2, lift), y:sMix(G, upAk.y + 11, lift)},
          upKn:upKn, upAk:upAk};
}
var SPOSES = {};
/* 1. 스탠딩 니업 언더클랩 (정면) — 무릎을 번갈아 가슴 높이로, 무릎 아래에서 양손 박수 */
SPOSES.kniup = function(u){
  var half=(u*2)%1, right = u<0.5;
  var lift = smooth(Math.min(1,half/0.30)) * smooth(Math.min(1,(1-half)/0.26));
  var hip={x:200,y:146}, sh={x:200,y:84}, head={x:200,y:55};
  var legs=[], near=null, far=null;
  [1,-1].forEach(function(side){
    var isUp = ((side===1)===right) ? lift : 0;
    var lg = sKneeLeg(side, isUp, 24, 46, 16);
    lg.far = side===-1;
    if(side===-1) far=lg; else near=lg;
    legs.push(lg);
  });
  var kn = right ? near : far, sgn = right ? 1 : -1;
  var clap = {x: kn.upKn.x - sgn*26, y: kn.upKn.y + 54};
  var arms=[], hands=[];
  [1,-1].forEach(function(side){
    var s={x:200+side*19,y:88};
    var rest={x:200+side*13,y:166};
    var t={x:sMix(rest.x,clap.x,lift), y:sMix(rest.y,clap.y,lift)};
    var r=sArm(s,t, side===1?'x+':'x-');
    arms.push({a:s,b:r.elbow,c:r.hand,far:side===-1});
    hands.push({x:r.hand.x + (side===-1? -3:3), y:r.hand.y + (side===-1? 4:-4), far:side===-1});
  });
  return {head:head, torso:[hip,sh], legs:[
            {a:far.a,b:far.b,c:far.c,far:true},{a:near.a,b:near.b,c:near.c}],
          arms:[{a:arms[1].a,b:arms[1].b,c:arms[1].c,far:true},{a:arms[0].a,b:arms[0].b,c:arms[0].c}],
          hands:[{x:hands[1].x,y:hands[1].y,far:true},{x:hands[0].x,y:hands[0].y}],
          feet:[{a:far.c,b:far.foot,far:true},{a:near.c,b:near.foot}]};
};

/* 2. 스탠딩 바이시클 크런치 (정면·비틀기) — 손은 머리 뒤, 상체를 무릎 쪽으로 비틀며 무릎을 든다 */
SPOSES.bicycle = function(u){
  var half=(u*2)%1, right = u<0.5;
  var lift = smooth(Math.min(1,half/0.28)) * smooth(Math.min(1,(1-half)/0.24));
  var sgn = right ? 1 : -1;
  var hip={x:200,y:146};
  var lean = -sgn*9*lift;                         /* 무릎 든 쪽으로 몸통을 비틀어 숙임 */
  var sh=up(hip, lean, L.torso);
  var head=up(sh, lean+3, 29);
  var px=Math.cos(lean*DEG), py=Math.sin(lean*DEG);
  var shR={x:sh.x+px*19, y:sh.y+py*19}, shL={x:sh.x-px*19, y:sh.y-py*19};
  var legs=[], near=null, far=null;
  [1,-1].forEach(function(side){
    var isUp = ((side===1)===right) ? lift : 0;
    var lg = sKneeLeg(side, isUp, 20, 42, 14);
    lg.far = side===-1;
    if(side===-1) far=lg; else near=lg;
    legs.push(lg);
  });
  var arms=[], hands=[];
  [1,-1].forEach(function(side){
    var s = side===1 ? shR : shL;
    var ear = {x: head.x + side*14, y: head.y + 7};
    var r=sArm(s, ear, side===1?'x+':'x-');
    arms.push({a:s,b:r.elbow,c:r.hand,far:side===-1});
    hands.push({x:r.hand.x,y:r.hand.y,far:side===-1});
  });
  return {head:head, torso:[hip,sh], legs:[
            {a:far.a,b:far.b,c:far.c,far:true},{a:near.a,b:near.b,c:near.c}],
          arms:[{a:arms[1].a,b:arms[1].b,c:arms[1].c,far:true},{a:arms[0].a,b:arms[0].b,c:arms[0].c}],
          hands:[{x:hands[1].x,y:hands[1].y,far:true},{x:hands[0].x,y:hands[0].y}],
          feet:[{a:far.c,b:far.foot,far:true},{a:near.c,b:near.foot}]};
};

/* 3. 스탠딩 오버헤드 암 다운 니업 (정면) — 머리 위 깍지 → 무릎 터치 */
SPOSES.ovknee = function(u){
  var half=(u*2)%1, right = u<0.5;
  var lift = smooth(Math.min(1,half/0.30)) * smooth(Math.min(1,(1-half)/0.26));
  var hip={x:200,y:146}, sh={x:200,y:84}, head={x:200,y:55};
  var legs=[], near=null, far=null;
  [1,-1].forEach(function(side){
    var isUp = ((side===1)===right) ? lift : 0;
    var lg = sKneeLeg(side, isUp, 30, 46, 10);
    lg.far = side===-1;
    if(side===-1) far=lg; else near=lg;
    legs.push(lg);
  });
  var kn = right ? near : far, sgn = right ? 1 : -1;
  var arms=[], hands=[];
  [1,-1].forEach(function(side){
    var s={x:200+side*19,y:88};
    var oh={x:200+side*4,y:24};                    // 머리 위 깍지
    var dn={x:kn.upKn.x - sgn*2 + side*3, y:kn.upKn.y - 6};
    var t={x:sMix(oh.x,dn.x,lift), y:sMix(oh.y,dn.y,lift)};
    var r=sArm(s,t, side===1?'x+':'x-');
    arms.push({a:s,b:r.elbow,c:r.hand,far:side===-1});
    hands.push({x:r.hand.x,y:r.hand.y,far:side===-1});
  });
  return {head:head, torso:[hip,sh], legs:[
            {a:far.a,b:far.b,c:far.c,far:true},{a:near.a,b:near.b,c:near.c}],
          arms:[{a:arms[1].a,b:arms[1].b,c:arms[1].c,far:true},{a:arms[0].a,b:arms[0].b,c:arms[0].c}],
          hands:[{x:hands[1].x,y:hands[1].y,far:true},{x:hands[0].x,y:hands[0].y}],
          feet:[{a:far.c,b:far.foot,far:true},{a:near.c,b:near.foot}]};
};

/* 4. 스탠딩 토 터치 (측면) — 다리를 앞위로 차올려 반대 손으로 발끝 터치, 좌우 번갈아 */
SPOSES.toetouch = function(u){
  var half=(u*2)%1, right = u<0.5;
  var k = smooth(Math.min(1,half/0.28)) * smooth(Math.min(1,(1-half)/0.26));
  var lean = 8 + 24*k;
  var hip={x:194,y:146};
  var sh=up(hip, lean, L.torso);
  var head=up(sh, lean+6, 29);
  /* 딛는 다리 */
  var supAnk={x:hip.x-10, y:G};
  var sup=sLeg({x:hip.x-6,y:hip.y}, supAnk, 'x+');
  /* 차올리는 다리: 무릎 편 채 앞위로 */
  var kickAng = 62*DEG;
  var fx=Math.sin(kickAng), fy=-Math.cos(kickAng);
  var knF={x:hip.x + fx*L.thigh*k, y:hip.y + fy*L.thigh*k};
  var akF={x:knF.x + fx*L.shin*k, y:knF.y + fy*L.shin*k};
  var ak0={x:hip.x+4, y:G}, kn0={x:hip.x+2, y:198};
  var knE={x:sMix(kn0.x,knF.x,k), y:sMix(kn0.y,knF.y,k)};
  var akE={x:sMix(ak0.x,akF.x,k), y:sMix(ak0.y,akF.y,k)};
  var kickNear = right;                                    /* 한 번은 오른발, 다음은 왼발 */
  var kickLeg = {a:hip, b:knE, c:akE, far:!kickNear};
  var supLeg  = {a:{x:hip.x-6,y:hip.y}, b:{x:sup.knee.x-5,y:sup.knee.y}, c:{x:supAnk.x-4,y:supAnk.y}, far:kickNear};
  var shN={x:sh.x+6,y:sh.y+2}, shF={x:sh.x-6,y:sh.y+2};
  var reach=sArm(shN, {x:akE.x-2, y:akE.y+2}, 'x+');
  var back =sArm(shF, {x:sh.x-34, y:sh.y-20}, 'x-');
  return {
    head:head, torso:[hip,sh],
    legs:[kickLeg, supLeg],
    arms:[{a:shF, b:back.elbow, c:back.hand, far:true},
          {a:shN, b:reach.elbow, c:reach.hand}],
    hands:[{x:back.hand.x,y:back.hand.y,far:true},{x:reach.hand.x,y:reach.hand.y}],
    feet:[{a:akE, b:{x:akE.x+4, y:akE.y+9}, far:!kickNear},
          {a:supLeg.c, b:{x:supLeg.c.x+11,y:G}, far:kickNear}]
  };
};

/* 5. 스탠딩 맨몸 사이드 밴드 (정면) — 한 손 골반, 반대팔 머리 위로, 옆구리 숙이기 */
SPOSES.sidebend = function(u){
  var half=(u*2)%1, right = u<0.5;
  var b = smooth(Math.min(1,half/0.30)) * smooth(Math.min(1,(1-half)/0.26));
  var dir = right ? 1 : -1;
  var ang = dir*30*b;
  var hip={x:200,y:146};
  var sh=up(hip, -ang, L.torso);
  var head=up(sh, -ang, 29);
  var legs=[{a:{x:193,y:146}, b:{x:188,y:198}, c:{x:183,y:G}, far:true},
            {a:{x:207,y:146}, b:{x:212,y:198}, c:{x:217,y:G}}];
  var px=Math.cos(ang*DEG), py=Math.sin(ang*DEG);
  var shR={x:sh.x+px*19, y:sh.y+py*19};
  var shL={x:sh.x-px*19, y:sh.y-py*19};
  var arms=[], hands=[];
  [1,-1].forEach(function(side){
    var s = side===1 ? shR : shL;
    var tgt;
    if(side === dir){
      tgt = {x: 200 + dir*21, y: 139};                       // 골반에 손
    } else {
      var overT={x: head.x + dir*14, y: head.y - 24};
      var upT  ={x: head.x - dir*12, y: head.y - 36};
      tgt = {x: sMix(upT.x, overT.x, b), y: sMix(upT.y, overT.y, b)};
    }

function bboxOf(fn){
  var mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  function add(q){ if(!q) return;
    mnx=Math.min(mnx,q.x-L.headR); mny=Math.min(mny,q.y-L.headR);
    mxx=Math.max(mxx,q.x+L.headR); mxy=Math.max(mxy,q.y+L.headR); }
  for(var i=0;i<=30;i++){
    var p = fn(i/30);
    add(p.head); add(p.torso[0]); add(p.torso[1]);
    p.legs.concat(p.arms).forEach(function(l){ add(l.a); add(l.b); add(l.c); });
    p.feet.forEach(function(f){ add(f.a); add(f.b); });
  }
  mny = Math.min(mny, G-L.headR);
  return {mnx:mnx,mny:mny,mxx:mxx,mxy:mxy};
}
function camera(fn, W, Hh, pad){
  var b = bboxOf(fn), w=b.mxx-b.mnx, h=b.mxy-b.mny;

  return {s:s, tx: W/2 - s*(b.mnx+w/2), ty: Hh/2 - s*(b.mny+h/2), b:b};
}

var actx = null;
function ensureAudio(){
  if(!soundOn) return null;
  try{
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended' && actx.resume) actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, delay, dur, type, vol){
  var c = ensureAudio(); if(!c) return;
  try{
    var t0 = c.currentTime + delay;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){}
}

var wakeSentinel = null;

  var on = !!wakeSentinel;

}

  navigator.wakeLock.request('screen').then(function(s){
    wakeSentinel = s; wakeChipSync();

  }).catch(function(){ wakeSentinel = null; wakeChipSync(); });
}

}

/* ══════════ 상태 기계 ══════════ */
var state = {
  mode:'idle',            // idle | ready | ex | rest | done
  running:false,
  paused:false,
  queue:[], qi:-1,        // queue item: {type:'ready'|'ex'|'rest'|'done', idx, dur, set, exInSet, setCount, lastOfSet, single}
  remain:0, phaseDur:0,
  lastWhole:-1
};
function buildQueue(singleIdx){
  var q = [], idxs = [];
  if(singleIdx >= 0) idxs = [singleIdx];
  else for(var i=0;i<EX.length;i++) idxs.push(i);
  for(var s=1; s<=setsN; s++){
    for(var j=0; j<idxs.length; j++){
      var lastOfSet = (j === idxs.length-1);
      var moreSets = (s < setsN);
      if(q.length) q.push({type:'rest', dur:restSec, next:idxs[j], set:s});
      q.push({type:'ready', dur:READY_SEC, idx:idxs[j], set:s,
              exInSet:j+1, setCount:idxs.length, lastOfSet:lastOfSet, single:(singleIdx>=0)});
      q.push({type:'ex', dur:exSec[idxs[j]], idx:idxs[j], set:s,
              exInSet:j+1, setCount:idxs.length, lastOfSet:lastOfSet, moreSets:moreSets, single:(singleIdx>=0)});
    }
  }

  return q;
}
function startQueue(singleIdx, label){

  skipBtn.disabled = false;

  startBtn.textContent = '⏸ 일시정지';
}
function beginItem(it){
  state.qi = state.queue.indexOf(it);
  if(it.type === 'done'){ finishSession(); return; }
  state.mode = it.type;
  state.phaseDur = it.dur;
  state.remain = it.dur;
  state.lastWhole = Math.ceil(it.dur);
  if(it.type === 'rest'){
    sDingdong();
    showExercise(it.next, 'rest', it);
  } else if(it.type === 'ready'){
    showExercise(it.idx, 'ready', it);
    sBeep();
  } else if(it.type === 'ex'){
    sDing();

  }

}
function advance(){
  var next = state.queue[state.qi+1];

  /* 종료 처리: 방금 끝난 항목 기록 */

    if(!cur.single && cur.lastOfSet && cur.set < setsN) toast(cur.set + '세트 완료! 조금만 쉬고 ' + (cur.set+1) + '세트째 가요 💪');

}

var shownEx = null, shownMode = 'idle', u0 = 0;

function frameLoop(){

  }

          state.lastWhole = whole;
          if(state.mode === 'ready' && whole >= 1) sBeep();
          if(state.mode === 'ex' && whole >= 1 && whole <= 3) sBeep();

  EX.forEach(function(e, i){
    var row = document.createElement('div');
    row.className = 'exrow' + (i===selIdx?' sel':'');
    var no = document.createElement('span'); no.className='no'; no.textContent = String(i+1);
    var nm = document.createElement('span'); nm.className='nm';
    var b = document.createElement('b'); b.textContent = e.name + (e.en ? ' (' + e.en + ')' : '');
    var sp = document.createElement('span'); sp.textContent = e.muscle;
    nm.appendChild(b); nm.appendChild(sp);
    var st = document.createElement('span'); st.className='stepper';
    var minus = document.createElement('button'); minus.type='button'; minus.textContent='−'; minus.setAttribute('aria-label', e.name+' 시간 5초 줄이기');
    var val = document.createElement('span'); val.className='val'; val.textContent = exSec[i]+'초';
    var plus = document.createElement('button'); plus.type='button'; plus.textContent='+'; plus.setAttribute('aria-label', e.name+' 시간 5초 늘리기');
    st.appendChild(minus); st.appendChild(val); st.appendChild(plus);
    var play = document.createElement('button'); play.type='button'; play.className='play'; play.textContent='▶'; play.setAttribute('aria-label', e.name+'만 바로 시작');
    row.appendChild(no); row.appendChild(nm); row.appendChild(st); row.appendChild(play);
    row.addEventListener('click', function(){ selectEx(i); });
    minus.addEventListener('click', function(ev){ ev.stopPropagation(); adjustEx(i, -EX_STEP); });
    plus.addEventListener('click', function(ev){ ev.stopPropagation(); adjustEx(i, +EX_STEP); });
    play.addEventListener('click', function(ev){ ev.stopPropagation(); startSession(i); });
    exList.appendChild(row);
    rowEls.push({row:row, val:val});
  });
}
function selectEx(i){
  selIdx = i; saveSettings();
  rowEls.forEach(function(r, j){ r.row.classList.toggle('sel', j===i); });
  if(state.mode === 'idle'){ showExercise(i, 'idle', null); updateIdleRing(); }
}
function adjustEx(i, d){
  exSec[i] = Math.min(EX_MAX, Math.max(EX_MIN, exSec[i] + d));
  rowEls[i].val.textContent = exSec[i] + '초';
  saveSettings();
  if(state.mode === 'idle' && i === selIdx) bigNum.textContent = String(exSec[i]);
}
function startSession(singleIdx){
  ensureAudio();
  if(singleIdx >= 0){
    startBtn.textContent = '⏸ 일시정지';
    startQueue(singleIdx);
    subLabel.textContent = EX[singleIdx].name + '만 진행합니다';
  } else {
    startQueue(-1);
  }
}
startBtn.addEventListener('click', function(){
  ensureAudio();
  if(state.mode === 'done'){ resetAll(); startSession(-1); return; }
  if(state.mode === 'idle'){ startSession(-1); return; }
  /* 진행 중 토글 */
  state.paused = !state.paused;
  if(state.paused){ startBtn.textContent = '▶ 계속'; startBtn.classList.remove('pause'); }
  else { startBtn.textContent = '⏸ 일시정지'; startBtn.classList.add('pause'); state._last = performance.now(); }
});
skipBtn.addEventListener('click', function(){
  if(!state.running) return;
  ensureAudio();
  advance();
});
resetBtn.addEventListener('click', function(){ resetAll(); });
soundBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  saveSettings();
  if(soundOn){ ensureAudio(); sDing(); }
});
Array.prototype.forEach.call(document.querySelectorAll('.setbtn'), function(btn){
  btn.addEventListener('click', function(){
    setsN = parseInt(btn.getAttribute('data-sets'), 10) || 1;
    syncSetBtns(); saveSettings();
    if(state.mode === 'idle') updateIdleRing();
  });
});
function syncSetBtns(){
  Array.prototype.forEach.call(document.querySelectorAll('.setbtn'), function(btn){
    btn.classList.toggle('on', parseInt(btn.getAttribute('data-sets'),10) === setsN);
  });
}
function adjustRest(d){
  restSec = Math.min(REST_MAX, Math.max(REST_MIN, restSec + d));
  restVal.textContent = restSec + '초';
  saveSettings();
}
$('restMinus').addEventListener('click', function(){ adjustRest(-5); });

/* ── 루틴 전환 탭 ── */
function syncTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    var on = b.getAttribute('data-routine') === ROUTINES[RI].id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $('brand').textContent = ROUTINES[RI].icon + ' ' + ROUTINES[RI].name;
}
function setRoutine(i){
  if(typeof i !== 'number' || i < 0 || i >= ROUTINES.length || i === RI) return;
  if(state.running){ resetAll(); }
  SECS[ROUTINES[RI].id] = exSec; SEL[ROUTINES[RI].id] = selIdx;
  RI = i;
  EX = ROUTINES[RI].ex;
  exSec = SECS[ROUTINES[RI].id];
  selIdx = SEL[ROUTINES[RI].id];
  curRec = countsFor(rec);
  saveSettings();
  syncTabs();
  buildList();
  renderRec();
  if(state.mode !== 'idle') resetAll();
  showExercise(selIdx, 'idle', null);
  updateIdleRing();
  syncPhaseClass();
  toast(ROUTINES[RI].icon + ' ' + ROUTINES[RI].name + ' 루틴으로 바꿨어요');
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
  b.addEventListener('click', function(){
    var id = b.getAttribute('data-routine'), idx = 0;
    ROUTINES.forEach(function(r,i){ if(r.id === id) idx = i; });
    setRoutine(idx);
  });
});
$('restPlus').addEventListener('click', function(){ adjustRest(+5); });

var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}
function renderRec(){
  curRec = countsFor(rec);
  todayRec.innerHTML = ROUTINES[RI].icon + ' ' + ROUTINES[RI].name + ' 오늘 기록 — <b>' + curRec.sets + '세트</b> · <b>' + curRec.ex + '개 운동</b> 완료' + (curRec.sets + curRec.ex > 0 ? ' 💪' : '');
}
function midnightTick(){ setInterval(recCheckMidnight, 30000); }

/* ══════════ 초기화 ══════════ */
soundBtn.textContent = soundOn ? '🔊' : '🔇';
restVal.textContent = restSec + '초';
syncSetBtns();
syncTabs();
buildList();
renderRec();
wakeChipSync();
skipBtn.disabled = true;
showExercise(selIdx, 'idle', null);
updateIdleRing();
requestAnimationFrame(frameLoop);
midnightTick();

/* 테스트·디버깅 훅 (값 참조용) */
window.__app = {
  state: state, POSES: POSES, CAM: CAM, routines: ROUTINES,
  routineId: function(){ return ROUTINES[RI].id; },
  ri: function(){ return RI; },
  EX: function(){ return EX; },
  exSec: function(){ return exSec; },
  restSec: function(){ return restSec; },
  buildQueue: buildQueue,
  rec: function(){ return rec; },
  curRec: function(){ return curRec; },
  selectEx: selectEx, adjustEx: adjustEx, adjustRest: adjustRest,
  setRoutine: setRoutine,
  startSession: startSession, skip: function(){ advance(); }, resetAll: resetAll
};
})();
</script>
</body>
</html>
