<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-mode="both">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08090b" id="themeColor" />
<title>만보기 · 스톱워치</title>
<style>
  :root{
    --bg:#07080a;
    --bg-glow:#121821;
    --fg:#f4f7fa;
    --dim:#828b99;
    --line:rgba(255,255,255,.09);
    --panel:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
    --btn:#1b222b;
    --btn-hi:#252e3a;
    --accent:#3be08c;
    --accent-ink:#03150c;
    --warn:#ffb648;
    --warn-ink:#1d1200;
    --glow:rgba(59,224,140,.20);
    --step-size:clamp(1.8rem, 14vw, 7rem);   /* 첫 페인트용 기본값 — 곧 JS가 화면에 맞게 다시 계산 */
    --sw-size:clamp(2rem, 13vw, 7rem);
  }
  html[data-theme="light"]{
    --bg:#e9edf3;
    --bg-glow:#ffffff;
    --fg:#0c1118;
    --dim:#5c6673;
    --line:rgba(12,17,24,.10);
    --panel:linear-gradient(180deg, #ffffff, #f5f8fc);
    --btn:#e6ebf2;
    --btn-hi:#dbe2ec;
    --accent:#069c61;
    --accent-ink:#ffffff;
    --warn:#c47400;
    --warn-ink:#ffffff;
    --glow:rgba(6,156,97,.14);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(120% 70% at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%),
      var(--bg);
    color:var(--fg);
    font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
  }
  button{ font-family:inherit; }

  /* ── 미리보기 안내 (JS가 꺼져 있을 때만 화면에 나타남) ── */
  .notice{
    display:block;
    padding:12px 16px;
    background:#132a20;
    border-bottom:1px solid #2d5b44;
    color:#d9ffe9;
    font-size:13px;
    line-height:1.55;
    text-align:center;
  }
  .notice b{ color:#fff; }
  html:not(.js) body{
    display:flex;
    flex-direction:column;
  }
  html:not(.js) .app{
    flex:1 1 auto;
    height:auto;
    min-height:0;
  }

  .app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:
      max(8px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }

  /* ── 상단 바 ── */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    min-height:34px;
  }
  .topbar-title{
    font-size:11px;
    letter-spacing:.16em;
    color:var(--dim);
    white-space:nowrap;
    text-transform:uppercase;
  }
  @media (max-width:520px){
    .topbar-title{ display:none; }
    .topbar-actions{ margin:0 auto; }
  }
  .topbar-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:6px;
    margin-left:auto;
  }
  .chip{
    appearance:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
    min-height:30px;
    padding:7px 11px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.04);
    color:var(--dim);
    font-size:11.5px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  html[data-theme="light"] .chip{ background:rgba(12,17,24,.035); }
  .chip:active{ transform:scale(.97); }
  .chip.is-on{
    color:var(--accent);
    border-color:var(--accent);
    background:var(--glow);
  }
  .chip svg{ width:13px; height:13px; display:block; }

  /* ── 화면 구성 ── */
  .stage{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:1.12fr 1fr;
    gap:clamp(8px, 1.5vh, 16px);
  }
  html[data-mode="steps"] .stage{ grid-template-rows:1fr; }
  html[data-mode="steps"] .sw-panel{ display:none; }
  /* 만보기만 볼 때는 남는 세로 공간을 여백으로 나눠 준다 */
  html[data-mode="steps"] .step-panel{ gap:clamp(6px, 2.4vh, 22px); }
  @media (orientation:landscape){
    .stage{ grid-template-rows:1fr; grid-template-columns:1.06fr 1fr; }
    html[data-mode="steps"] .stage{ grid-template-columns:1fr; }
  }

  .panel{
    position:relative;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(10px, 2.2vh, 22px) clamp(10px, 2.4vw, 24px);
    border:1px solid var(--line);
    border-radius:clamp(16px, 3vh, 26px);
    background:var(--panel);
    overflow:hidden;
  }

  /* ── 만보기 ── */
  .step-panel{
    gap:clamp(4px, 1.1vh, 11px);
    justify-content:center;
    /* 숫자 아래 은은한 빛: 넘치는 의사요소 대신 배경으로 깔아 스크롤 영역을 만들지 않는다 */
    background:
      radial-gradient(58% 46% at 50% 112%, var(--glow), transparent 72%),
      var(--panel);
  }
  .step-date{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    font-size:clamp(11px, 1.8vh, 17px);
    font-weight:600;
    color:var(--dim);
    letter-spacing:.02em;
    line-height:1.2;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    text-align:center;
  }
  .step-main{
    position:relative;
    z-index:1;
    flex:0 1 auto;
    min-height:0;
    max-width:100%;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:0;
    line-height:.92;
  }
  /* 크기 계산용 사본: 화면 밖에 고정해 두고 실제 글자 폭·높이를 잰다 (패널 스크롤 영역을 건드리지 않게 fixed) */
  .step-probe{
    position:fixed;
    left:-10000px;
    top:0;
    z-index:-1;
    display:flex;
    align-items:baseline;
    gap:0;
    line-height:.92;
    max-width:none;
    white-space:nowrap;
    visibility:hidden;
    pointer-events:none;
  }
  .step-count{
    font-size:var(--step-size);
    font-weight:300;
    letter-spacing:-.045em;
    line-height:.92;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    text-shadow:0 0 48px rgba(255,255,255,.06);
  }
  html[data-theme="light"] .step-count{ text-shadow:0 8px 30px rgba(12,17,24,.10); }
  .step-unit{
    font-size:calc(var(--step-size) * .17);
    font-weight:700;
    letter-spacing:.01em;
    color:var(--dim);
    white-space:nowrap;
    line-height:1;
    margin-left:.34em;      /* 단위 글자 크기 기준 → 숫자와 살짝 띄운다 */
  }
  .step-sub{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    font-size:clamp(11px, 1.75vh, 15px);
    font-weight:600;
    color:var(--dim);
    opacity:.92;
    letter-spacing:.01em;
    line-height:1.2;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    text-align:center;
  }
  .step-foot{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(6px, 1.6vw, 12px);
    max-width:100%;
  }
  .step-state{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:clamp(30px, 4.6vh, 40px);
    padding:0 clamp(9px, 2.4vw, 14px);
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.045);
    color:var(--dim);
    font-size:clamp(11px, 1.7vh, 14px);
    font-weight:600;
    letter-spacing:.01em;
    line-height:1;
    white-space:nowrap;
  }
  html[data-theme="light"] .step-state{ background:rgba(12,17,24,.032); }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--dim);
    opacity:.45;
    transition:background .2s, opacity .2s;
  }
  .step-state .dot{ width:6px; height:6px; flex:0 0 auto; }
  .step-panel.is-on .step-state .dot{
    background:var(--accent);
    opacity:1;
    box-shadow:0 0 8px var(--accent);
    animation:pulse 1.9s ease-in-out infinite;
  }
  .step-panel.is-dead .step-state{ color:var(--warn); border-color:rgba(255,182,72,.35); }
  .step-panel.is-dead .step-state .dot{ background:var(--warn); opacity:1; }
  @keyframes pulse{ 50%{ opacity:.3; } }

  .step-btn{
    appearance:none;
    min-height:clamp(30px, 4.6vh, 40px);
    padding:0 clamp(14px, 3.6vw, 24px);
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--btn);
    color:var(--fg);
    font-size:clamp(12px, 1.8vh, 15px);
    font-weight:700;
    letter-spacing:.01em;
    line-height:1;
    white-space:nowrap;
    cursor:pointer;
    transition:transform .06s ease, background .15s ease, color .15s ease, opacity .15s;
  }
  .step-btn:active{ transform:scale(.97); }
  .step-btn.primary{
    background:var(--accent);
    border-color:transparent;
    color:var(--accent-ink);
    box-shadow:0 8px 22px var(--glow);
  }
  .step-btn.is-running{
    background:var(--warn);
    border-color:transparent;
    color:var(--warn-ink);
    box-shadow:0 8px 22px rgba(255,182,72,.18);
  }
  .step-btn:disabled{
    opacity:.35;
    cursor:default;
    box-shadow:none;
  }
  .step-hint{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    font-size:clamp(10px, 1.55vh, 12.5px);
    font-weight:500;
    color:var(--dim);
    opacity:.72;
    letter-spacing:.01em;
    text-align:center;
    line-height:1.3;
  }

  /* ── 스톱워치 ── */
  .sw-panel{
    --sw-size:clamp(2rem, 13vw, 7rem);
    justify-content:flex-start;
    gap:clamp(7px, 1.3vh, 14px);
    padding-top:clamp(10px, 2vh, 20px);
  }
  .sw-head{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:7px;
    height:14px;
  }
  .sw-label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.18em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .sw-panel.is-running .sw-head .dot{
    background:var(--accent);
    opacity:1;
    box-shadow:0 0 10px var(--accent);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .lap-count{
    font-size:10.5px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
  }
  .digits{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    font-weight:300;
    letter-spacing:-.03em;
    line-height:1;
    white-space:nowrap;
  }
  .sw-digits{
    flex:0 0 auto;
    font-size:var(--sw-size);
  }
  .sw-digits.is-paused{ color:var(--dim); }

  .sw-buttons{
    flex:0 0 auto;
    width:100%;
    display:grid;
    grid-template-columns:1.35fr 1fr 1fr;
    gap:clamp(7px, 1.2vw, 12px);
  }
  .btn{
    appearance:none;
    min-height:clamp(50px, 8.5vh, 72px);
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:clamp(14px, 2vh, 20px);
    background:var(--btn);
    color:var(--fg);
    font-size:clamp(14px, 2vh, 18px);
    font-weight:700;
    letter-spacing:.01em;
    cursor:pointer;
    transition:transform .06s ease, background .15s ease, color .15s ease, opacity .15s;
  }
  .btn:active{ transform:scale(.97); background:var(--btn-hi); }
  .btn.primary{
    background:var(--accent);
    border-color:transparent;
    color:var(--accent-ink);
    box-shadow:0 8px 24px var(--glow);
  }
  .btn.primary:active{ background:var(--accent); }
  .btn.is-running{
    background:var(--warn);
    border-color:transparent;
    color:var(--warn-ink);
    box-shadow:0 8px 24px rgba(255,182,72,.18);
  }
  .btn:disabled{
    opacity:.32;
    cursor:default;
    box-shadow:none;
  }
  .btn:disabled:active{ transform:none; background:var(--btn); }

  /* ── 랩 목록 ── */
  .lap-wrap{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    flex-direction:column;
    margin-top:clamp(2px, .6vh, 6px);
  }
  .lap-head{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:3.1em 1fr 1fr;
    gap:8px;
    padding:0 6px 6px;
    border-bottom:1px solid var(--line);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--dim);
  }
  .lap-head span:nth-child(2),
  .lap-head span:nth-child(3){ text-align:right; }
  .lap-list{
    list-style:none;
    margin:0;
    padding:0;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .lap{
    display:grid;
    grid-template-columns:3.1em 1fr 1fr;
    gap:8px;
    align-items:center;
    padding:clamp(6px, 1vh, 10px) 6px;
    border-bottom:1px solid var(--line);
    font-size:clamp(13px, 1.9vh, 16px);
    font-variant-numeric:tabular-nums;
  }
  .lap-no{ color:var(--dim); font-weight:600; }
  .lap-split{ text-align:right; font-weight:700; }
  .lap-total{ text-align:right; color:var(--dim); }
  .lap.is-new{ animation:flash 1.1s ease-out; }
  @keyframes flash{ from{ background:var(--glow); } to{ background:transparent; } }
  .lap-empty{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
    font-size:clamp(12px, 1.7vh, 14px);
    color:var(--dim);
    opacity:.75;
    line-height:1.5;
  }
  .lap-empty[hidden]{ display:none; }

  /* ── 토스트 ── */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:70;
    max-width:86vw;
    padding:10px 16px;
    border-radius:999px;
    background:var(--fg);
    color:var(--bg);
    font-size:13px;
    font-weight:600;
    text-align:center;
    opacity:0;
    transform:translate(-50%, 10px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ── 컨테이너 기반 크기 (지원 브라우저) ── */
  @supports (container-type: size){
    .sw-panel{
      container-type:size;
      --sw-size:clamp(2rem, min(22cqw, 24cqh), 10rem);
    }
  }

  @media (max-height:430px){
    .app{ gap:6px; }
    .step-panel{ gap:3px; padding-top:8px; padding-bottom:8px; }
    .step-date{ font-size:11px; }
    .step-sub{ font-size:11px; }
    .step-state,.step-btn{ min-height:26px; font-size:11px; }
    .step-hint{ font-size:10px; }
    .sw-panel{ gap:6px; }
    .btn{ min-height:44px; font-size:14px; }
    .lap-head{ padding-bottom:4px; }
  }
</style>
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<noscript>
  <div class="notice" id="previewNotice">
    지금은 미리보기 화면이라 만보기와 스톱워치가 움직이지 않아요.<br>
    <b>내 파일 → 다운로드</b>에서 이 파일을 <b>Chrome</b>으로 열면 바로 실행됩니다.
  </div>
</noscript>

<div class="app">
  <header class="topbar">
    <div class="topbar-title">만보기 · 스톱워치</div>
    <div class="topbar-actions">
      <button class="chip" id="modeBtn" type="button" aria-pressed="false">만보기만</button>
      <button class="chip" id="wakeBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
        화면 유지
      </button>
      <button class="chip" id="themeBtn" type="button" aria-pressed="false">라이트</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="panel step-panel" id="stepPanel" aria-label="오늘 걸음 수">
      <div class="step-date" id="stepDate">----년 --월 --일 (---)</div>

      <div class="step-main" id="stepMain">
        <span class="step-count" id="stepCount" aria-label="오늘 걸음 수 0걸음">0</span>
        <span class="step-unit">걸음</span>
      </div>

      <div class="step-sub" id="stepSub" title="보폭 72cm, 걸음당 0.04 kcal 기준 추정치예요">예상 0.00 km · 0 kcal</div>

      <div class="step-foot">
        <span class="step-state"><span class="dot" aria-hidden="true"></span><span id="stepStatus">일시정지</span></span>
        <button class="step-btn primary" id="stepBtn" type="button" aria-pressed="false">시작</button>
      </div>

      <div class="step-hint" id="stepHint">화면이 켜져 있을 때만 걸음이 올라가요</div>
    </section>

    <section class="panel sw-panel" id="swPanel" aria-label="스톱워치">
      <div class="sw-head">
        <span class="dot" aria-hidden="true"></span>
        <span class="sw-label">스톱워치</span>
        <span class="lap-count" id="lapCount"></span>
      </div>
      <div class="digits sw-digits" id="swTime" role="timer" aria-live="off">00:00.00</div>
      <div class="sw-buttons">
        <button class="btn primary" id="btnMain" type="button">시작</button>
        <button class="btn" id="btnLap" type="button" disabled>랩</button>
        <button class="btn" id="btnReset" type="button" disabled>초기화</button>
      </div>
      <div class="lap-wrap">
        <div class="lap-head"><span>랩</span><span>구간</span><span>누적</span></div>
        <ul class="lap-list" id="lapList"></ul>
        <div class="lap-empty" id="lapEmpty">랩 버튼을 누르면 구간이 기록돼요</div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<span class="step-probe" id="stepProbe" aria-hidden="true"><span class="step-count" id="stepProbeCount">0</span><span class="step-unit">걸음</span></span>

<script>
(function () {
  'use strict';

  /* ───────────────────────── 순수 함수 ───────────────────────── */
  var DAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  /* 추정치 기준: 보폭 72cm, 걸음당 0.04 kcal */
  var STRIDE_M = 0.72;
  var KCAL_PER_STEP = 0.04;

  function pad2(n) {
    n = Math.floor(Math.abs(n));
    return n < 10 ? '0' + n : String(n);
  }

  /* 스톱워치 표시: 분:초.1/100초, 1시간 넘으면 H:MM:SS.cc */
  function formatStopwatch(ms) {

  /*
   * 걸음 감지기
   *  1) 가속도 크기에서 저역통과로 중력 추정 → 중력 제거(미분 가속도)
   *  2) 평활(EMA)로 순간 잡음 제거
   *  3) 히스테리시스 임계값(진입/해제) + 적응형 노이즈 바닥
   *  4) 최소 걸음 간격(MIN_INTERVAL, 약 280~350ms)으로 중복 피크·손 훼들기 억제
   *  5) 샘플 공백이 크면(백그라운드 복귀 등) 상태를 리셋해 가짜 걸음 방지

  function createStepDetector(opts) {
    opts = opts || {};
    var MIN_INTERVAL = numOr(opts.minInterval, 320);   /* ms, 최소 걸음 간격 */
    var ENTER_BASE = numOr(opts.threshold, 0.72);      /* m/s^2, 기본 진입 임계값 */
    var ENTER_MAX = 2.0;
    var RELEASE_RATIO = 0.22;
    var SMOOTH = 0.34;
    var GRAV_ALPHA = 0.94;

    var gravity = 0, hasGravity = false;
    var smooth = 0, noise = 0.08;

    /* s: {x,y,z,t,gravity:boolean}  →  {step, signal, threshold} */
    function feed(s) {
      if (!s) return { step: false, signal: smooth, threshold: ENTER_BASE };
      var x = Number(s.x), y = Number(s.y), z = Number(s.z);
      if (!isFinite(x) || !isFinite(y) || !isFinite(z)) return { step: false, signal: smooth, threshold: ENTER_BASE };
      var t = Number(s.t);
      if (!isFinite(t)) t = lastSampleAt > -1e8 ? lastSampleAt + 16 : 0;

      var mag = Math.sqrt(x * x + y * y + z * z);
      var sig;
      if (s.gravity === false) {
        /* acceleration(중력 제거된 축별 값)만 올 때: 크기에는 부호가 없어 두 배로 세어지므로
           가장 크게 흔들린 축의 부호를 붙여 진동을 되살린다 */
        var ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
        var dom = (ax >= ay && ax >= az) ? x : (ay >= az ? y : z);
        sig = dom < 0 ? -mag : mag;
      } else {
        if (!hasGravity) { gravity = mag; hasGravity = true; }
        gravity = gravity * GRAV_ALPHA + mag * (1 - GRAV_ALPHA);
        sig = mag - gravity;
      }

      if (t - lastSampleAt > REST_GAP || t < lastSampleAt) { smooth = 0; armed = true; }
      lastSampleAt = t;
      smooth += (sig - smooth) * SMOOTH;

      var enter = Math.min(ENTER_MAX, ENTER_BASE + noise * 1.4);
      var a = Math.abs(smooth);
      /* 조용할 때만 노이즈 바닥을 아주 천천히 따라간다(느린 걸음도 문턱을 밀어 올리지 않게) */
      if (a < enter * 0.45) noise += (a - noise) * 0.0015;
      else noise += (a - noise) * 0.00002;
      if (noise < 0) noise = 0;
      if (noise > 0.22) noise = 0.22;

      var step = false;
      if (armed && smooth >= enter) {
        if (t - lastStepAt >= MIN_INTERVAL) { step = true; count++; lastStepAt = t; }
        armed = false;
      } else if (!armed && smooth <= enter * RELEASE_RATIO) {
        armed = true;
      }
      return { step: step, signal: smooth, threshold: enter };
    }

    return {
      feed: feed,
      reset: reset,
      count: function () { return count; },
      threshold: function () { return Math.min(ENTER_MAX, ENTER_BASE + noise * 1.4); }

  /* DeviceMotionEvent → {x,y,z,gravity} (값이 없으면 null) */
  function motionSample(ev) {

    var b = ev && ev.acceleration;
    if (b && isNum(b.x) && isNum(b.y) && isNum(b.z)) return { x: b.x, y: b.y, z: b.z, gravity: false };

  /* 스톱워치 상태 기계 (시작/일시정지/랩/초기화) */
  function createStopwatch(nowFn, initial) {

  /* ───────────────────────── 화면 연결 ───────────────────────── */

    var el = {
      stepPanel: $('stepPanel'),
      stepMain: $('stepMain'),
      stepProbe: $('stepProbe'),
      stepProbeCount: $('stepProbeCount'),
      stepCount: $('stepCount'),
      stepDate: $('stepDate'),
      stepSub: $('stepSub'),
      stepStatus: $('stepStatus'),
      stepBtn: $('stepBtn'),
      stepHint: $('stepHint'),
      swTime: $('swTime'),
      swPanel: $('swPanel'),
      btnMain: $('btnMain'),
      btnLap: $('btnLap'),
      btnReset: $('btnReset'),
      lapList: $('lapList'),
      lapEmpty: $('lapEmpty'),
      lapCount: $('lapCount'),
      modeBtn: $('modeBtn'),
      wakeBtn: $('wakeBtn'),
      themeBtn: $('themeBtn'),
      themeColor: $('themeColor'),
      toast: $('toast')

    if (!el.stepPanel || !el.stepCount || !el.swTime || !el.btnMain) return;

    var prefs = { mode: 'both', theme: 'dark' };

    function readJSON(key) {
      try {
        var raw = window.localStorage.getItem(key);

    var stored = readJSON(UI_KEY);

    /* ── 저장 ── */

      running: '측정 중',
      paused: '일시정지',
      dead: '센서 신호 없음',

        lastStepsText = txt;
        var sub = formatEstimate(day.steps);

          el.stepSub.textContent = sub;
          lastStepsSub = sub;
        }
        if (lenChanged) fitLater();

      if (el.stepStatus.textContent !== STEP_LABEL[st]) el.stepStatus.textContent = STEP_LABEL[st];
      el.stepPanel.classList.toggle('is-on', st === 'running');
      el.stepPanel.classList.toggle('is-dead', st === 'dead' || st === 'unsupported' || st === 'denied');

      if (el.stepBtn.textContent !== (on ? '일시정지' : '시작')) el.stepBtn.textContent = on ? '일시정지' : '시작';
      el.stepBtn.classList.toggle('is-running', on);

    function onMotion(e) {
      if (!day.active || !pedListening) return;

      el.btnMain.classList.toggle('is-running', running);

    function frame() {

    }
    function startLoop() {
      if (rafId === null && window.requestAnimationFrame) rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
      if (rafId !== null) {
        window.cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    /* ── 화면에 꽉 차게 글자 크기 맞추기 ── */
    function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }

    function fitOnce(panel, box, availW, availH, varName) {
      var rect = box.getBoundingClientRect();
      var size = num(window.getComputedStyle(box).fontSize);
      if (!rect.width || !rect.height || !size) return;
      var k = Math.min(availW / rect.width, availH / rect.height);
      if (!isFinite(k) || k <= 0) return;
      var next = Math.max(15, Math.min(size * k * 0.985, 560));
      panel.style.setProperty(varName, next.toFixed(2) + 'px');
    }

    function blockH(node) {
      if (!node || node.offsetHeight === 0) return 0;
      var cs = window.getComputedStyle(node);
      if (cs.display === 'none') return 0;
      return node.offsetHeight + num(cs.marginTop) + num(cs.marginBottom);
    }

    function fitSteps() {
      var panel = el.stepPanel;
      if (!panel || !el.stepProbe || !el.stepProbeCount) return;
      if (!panel.clientWidth || !panel.clientHeight) return;
      var cs = window.getComputedStyle(panel);
      var availW = panel.clientWidth - num(cs.paddingLeft) - num(cs.paddingRight);
      var gap = num(cs.rowGap);
      var extras = blockH(el.stepDate) + blockH(el.stepSub) +
                   blockH(panel.querySelector('.step-foot')) + blockH(el.stepHint);
      var gaps = gap * 4;   /* 날짜·숫자·보조·버튼·안내 = 5덩어리 */
      var availH = panel.clientHeight - num(cs.paddingTop) - num(cs.paddingBottom) - extras - gaps - 8;
      if (availW <= 0 || availH <= 0) return;

      el.stepProbeCount.textContent = formatSteps(day.steps);
      /* 100px에서 한 번 재고, 실제 화면 폭·높이에 맞는 크기를 바로 구한다 */
      root.style.setProperty('--step-size', '100px');
      var w = el.stepProbe.getBoundingClientRect().width;
      var h = el.stepProbe.getBoundingClientRect().height;
      if (w <= 0 || h <= 0) return;
      var size = Math.min(availW / (w / 100), availH / (h / 100)) * 0.95;
      if (!isFinite(size)) return;
      size = Math.max(14, Math.min(size, 560));
      root.style.setProperty('--step-size', size.toFixed(2) + 'px');

      /* 안전 확인: 넘쳤으면 딱 맞게 줄인다 */
      var w2 = el.stepProbe.getBoundingClientRect().width;
      var h2 = el.stepProbe.getBoundingClientRect().height;
      if (w2 > availW || h2 > availH) {
        var k = Math.min(availW / w2, availH / h2) * 0.985;
        if (isFinite(k) && k > 0) root.style.setProperty('--step-size', Math.max(14, size * k).toFixed(2) + 'px');
      }
    }

    function fitSw() {
      var panel = el.swPanel;
      if (!panel || !panel.clientWidth) return;
      var cs = window.getComputedStyle(panel);
      var availW = panel.clientWidth - num(cs.paddingLeft) - num(cs.paddingRight);
      var head = panel.querySelector('.sw-head');
      var buttons = panel.querySelector('.sw-buttons');
      var fixed = (head ? head.offsetHeight : 0) + (buttons ? buttons.offsetHeight : 0) + num(cs.rowGap) * 3 + 80;
      var availH = panel.clientHeight - num(cs.paddingTop) - num(cs.paddingBottom) - fixed;
      if (availW <= 0 || availH <= 0) return;
      fitOnce(panel, el.swTime, availW, availH, '--sw-size');
      fitOnce(panel, el.swTime, availW, availH, '--sw-size');
    }

    var fitTick = null;
    function fitLater() {
      if (fitTick !== null) window.cancelAnimationFrame(fitTick);
      fitTick = window.requestAnimationFrame(function () {
        fitTick = null;
        fitSteps();
        fitSw();
      });
    }

    /* ── 토스트 ── */
    var toastTimer = null;
    function toast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.toast.classList.remove('show');
        toastTimer = null;
      }, 2200);
    }

    /* ── 스톱워치 동작 ── */
    function onToggle() {
      sw.toggle();
      paintStopwatch();
      if (sw.isRunning()) startLoop();
      else stopLoop();
      writeUI();
    }

    function onLap() {
      var lap = sw.lap();
      if (!lap) {
        toast('시작하면 랩을 기록할 수 있어요');
        return;
      }
      paintLaps();
      paintStopwatch();
      el.lapList.scrollTop = 0;
      writeUI();
    }

    function onReset() {
      if (!sw.isRunning() && sw.elapsed() === 0 && sw.laps().length === 0) return;
      sw.reset();
      stopLoop();
      paintStopwatch();
      paintLaps();
      writeUI();
      toast('초기화했어요');
    }

    /* ── 모드 · 테마 ── */
    function applyMode() {
      root.setAttribute('data-mode', prefs.mode);
      var only = prefs.mode === 'steps';
      el.modeBtn.textContent = only ? '함께 보기' : '만보기만';
      el.modeBtn.classList.toggle('is-on', only);
      el.modeBtn.setAttribute('aria-pressed', only ? 'true' : 'false');
      fitLater();
    }
    function applyTheme() {
      root.setAttribute('data-theme', prefs.theme);
      var light = prefs.theme === 'light';
      el.themeBtn.textContent = light ? '다크' : '라이트';
      el.themeBtn.classList.toggle('is-on', light);
      el.themeBtn.setAttribute('aria-pressed', light ? 'true' : 'false');
      if (el.themeColor) el.themeColor.setAttribute('content', light ? '#e9edf3' : '#08090b');
    }
    function toggleMode() {
      prefsTouched = true;
      prefs.mode = prefs.mode === 'steps' ? 'both' : 'steps';
      applyMode();
      writeUI();
    }
    function toggleTheme() {
      prefsTouched = true;
      prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      writeUI();
    }

    /* ── 화면 꺼짐 방지 ── */
    var wakeSupported = !!(navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
    var wakeSentinel = null;
    var wakeWanted = false;

    function noop() {}
    function paintWake() {
      el.wakeBtn.classList.toggle('is-on', !!wakeSentinel);
      el.wakeBtn.setAttribute('aria-pressed', wakeSentinel ? 'true' : 'false');
      el.wakeBtn.style.opacity = wakeSupported ? '' : '.45';
    }
    function requestWake() {
      if (!wakeSupported) {
        wakeWanted = false;
        paintWake();
        toast('이 브라우저에서는 화면 유지가 안 돼요');
        return;
      }
      try {
        navigator.wakeLock.request('screen').then(function (sentinel) {
          wakeSentinel = sentinel;
          if (sentinel && typeof sentinel.addEventListener === 'function') {
            sentinel.addEventListener('release', function () {
              if (wakeSentinel === sentinel) {
                wakeSentinel = null;
                paintWake();
              }
            });
          }
          paintWake();
          toast('화면이 꺼지지 않아요');
        }).catch(function (err) {
          wakeSentinel = null;
          wakeWanted = false;
          paintWake();
          toast('화면 유지를 켤 수 없어요' + (err && err.name ? ' (' + err.name + ')' : ''));
        });
      } catch (e) {
        wakeSentinel = null;
        wakeWanted = false;
        paintWake();
        toast('화면 유지를 켤 수 없어요');
      }
    }
    function toggleWake() {
      if (wakeWanted) {
        wakeWanted = false;
        var s = wakeSentinel;
        wakeSentinel = null;
        paintWake();
        if (s && typeof s.release === 'function') {
          try { s.release().catch(noop); } catch (e) { /* 무시 */ }
        }
        toast('화면 유지를 껐어요');
      } else {
        wakeWanted = true;
        requestWake();
      }
    }

    /* ── 이벤트 ── */
    el.btnMain.addEventListener('click', onToggle);
    el.btnLap.addEventListener('click', onLap);
    el.btnReset.addEventListener('click', onReset);
    el.stepBtn.addEventListener('click', toggleSteps);
    el.modeBtn.addEventListener('click', toggleMode);
    el.themeBtn.addEventListener('click', toggleTheme);
    el.wakeBtn.addEventListener('click', toggleWake);

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        /* 백그라운드에서는 센서가 멈추므로 복귀 시 상태·날짜를 다시 본다 */
        lastMotionAt = Date.now();
        if (day.active && !pedListening && !needPermission) attachMotion();
        checkDayRollover();
        paintDate();
        paintSteps();
        paintStopwatch();
        if (wakeWanted && !wakeSentinel) requestWake();
        fitLater();
      } else {
        writeStepStore();
        writeUI();
      }
    });
    window.addEventListener('pagehide', function () {
      writeStepStore();
      writeUI();
    });

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
      var onButton = !!(e.target && e.target.tagName === 'BUTTON');
      var k = e.key;
      if (k === ' ' || k === 'Spacebar' || k === 'Enter') {
        if (onButton) return;         /* 버튼에 포커스가 있으면 버튼 자체 동작을 존중 */
        e.preventDefault();
        onToggle();
      } else if (k === 'l' || k === 'L') {
        e.preventDefault();
        onLap();
      } else if (k === 'r' || k === 'R') {
        e.preventDefault();
        onReset();
      } else if (k === 'm' || k === 'M') {
        e.preventDefault();
        toggleMode();
      } else if (k === 't' || k === 'T') {
        e.preventDefault();
        toggleTheme();
      }
    });

    /* ── 시작 ── */
    applyMode();
    applyTheme();
    checkDayRollover();
    /* 열 때 날짜가 바뀌었으면 곧바로 오늘 기록으로 저장 */
    if (stepStoreRaw && stepStoreRaw.date !== day.date) writeStepStore();
    if (day.active) autoStartSteps();
    paintDate();
    paintSteps();
    paintStopwatch();
    paintLaps();
    paintWake();

    /* 0.5초마다 날짜·센서 상태 확인 → 자정이 지나면 즉시 0 */
    setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      checkDayRollover();
      paintDate();
      paintSteps();
    }, 500);

    /* file:// 에서 아주 빠르게 다시 열면 첫 읽기가 빈손일 때가 있다.
       잠시 뒤 한 번 더 읽어 오늘 기록·설정을 되살린다(사용자가 이미 건드렸으면 그대로 둔다) */
    setTimeout(function () {
      if (stepStoreWasEmpty && !stepsTouched) {
        var raw = readJSON(STEP_KEY);
        if (raw && raw.date === day.date) {
          var n = Math.floor(Number(raw.steps));
          if (isFinite(n) && n > day.steps) {
            day.steps = n;
            lastStepsText = '';
            lastStepsSub = '';
            paintSteps();
          }
        }
      }
      if (storeWasEmpty && !prefsTouched) {
        var ui = readJSON(UI_KEY);
        if (ui && ui.ui && typeof ui.ui === 'object') {
          var mode = ui.ui.mode === 'steps' ? 'steps' : 'both';
          var theme = ui.ui.theme === 'light' ? 'light' : 'dark';
          if (mode !== prefs.mode) { prefs.mode = mode; applyMode(); }
          if (theme !== prefs.theme) { prefs.theme = theme; applyTheme(); }
        }
      }
    }, 350);

    fitLater();
    window.addEventListener('resize', fitLater);
    window.addEventListener('orientationchange', fitLater);
    window.addEventListener('load', fitLater);
    setTimeout(fitLater, 260);
    if (sw.isRunning()) startLoop();
  });
})();
</script>
</body>
</html>
