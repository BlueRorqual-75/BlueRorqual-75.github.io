/* ───────────── 선택 사진 내보내기 (실제 이미지 · ZIP · 공유) ───────────── */
function stampSec() {
  const d = new Date();
  const p = (x) => String(x).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
    p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

const EXT_BY_TYPE = {
  'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/pjpeg': 'jpg', 'image/png': 'png',
  'image/webp': 'webp', 'image/gif': 'gif', 'image/bmp': 'bmp', 'image/heic': 'heic',
  'image/heif': 'heif', 'image/avif': 'avif', 'image/tiff': 'tif', 'image/svg+xml': 'svg',
  'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm', 'video/x-m4v': 'm4v',
  'video/3gpp': '3gp', 'video/3gpp2': '3g2', 'video/ogg': 'ogv', 'video/x-matroska': 'mkv'
};

/* 원본 파일명 유지 + zip/공유에 안전한 이름 만들기 */
function exportNameFor(item) {
  const meta = item.meta || {};
  const video = meta.kind === 'video';
  const raw = String(meta.name || '').trim();
  const mExt = (raw.match(/\.([A-Za-z0-9]{2,5})$/) || [])[1];
  let ext = EXT_BY_TYPE[meta.type] || (mExt ? mExt.toLowerCase() : (video ? 'mp4' : 'jpg'));
  ext = String(ext).replace(/[^a-z0-9]/gi, '') || (video ? 'mp4' : 'jpg');
  let base = raw.replace(/\.[^./\\]*$/, '');
  base = base.replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g, '_').replace(/\s+/g, ' ').trim();
  if (!base) base = video ? '동영상' : '사진';
  if (base.length > 90) base = base.slice(0, 90).trim() || (video ? '동영상' : '사진');
  return { base: base, ext: ext };
}

function uniqueFileName(base, ext, used) {
  let name = base + '.' + ext;
  let k = 2;
  while (used.has(name.toLowerCase())) { name = base + ' (' + k + ').' + ext; k++; }
  used.add(name.toLowerCase());
  return name;
}

/* ZIP Store (무압축) 방식으로 직접 만들기 — 외부 라이브러리 없음 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function dosDateTime(d) {
  const time = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((d.getSeconds() >> 1) & 0x1F);
  const date = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0x0F) << 5) | (d.getDate() & 0x1F);
  return { time: time & 0xFFFF, date: date & 0xFFFF };
}

function buildZip(entries) {
  const enc = new TextEncoder();
  const dt = dosDateTime(new Date());
  const parts = [];
  const central = [];
  let offset = 0;
  entries.forEach((e) => {
    const nameBytes = enc.encode(e.name);
    const data = e.data;
    const crc = crc32(data);
    const size = data.length;

    const lh = new Uint8Array(30 + nameBytes.length);
    const ldv = new DataView(lh.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0x0800, true);   // bit 11: UTF-8 파일명
    ldv.setUint16(8, 0, true);        // 방법: Store
    ldv.setUint16(10, dt.time, true);
    ldv.setUint16(12, dt.date, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, size, true);
    ldv.setUint32(22, size, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(ch.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dt.time, true);
    cdv.setUint16(14, dt.date, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);

    offset += lh.length + size;
  });

  const cdStart = offset;
  let cdSize = 0;
  central.forEach((c) => { parts.push(c); cdSize += c.length; });

  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, entries.length, true);
  edv.setUint16(10, entries.length, true);
  edv.setUint32(12, cdSize, true);
  edv.setUint32(16, cdStart, true);
  edv.setUint16(20, 0, true);
  parts.push(eocd);

  let total = 0;
  parts.forEach((p) => { total += p.length; });
  const out = new Uint8Array(total);
  let o = 0;
  parts.forEach((p) => { out.set(p, o); o += p.length; });
  return out;
}

function downloadBytes(bytes, name, type) {
  const blob = new Blob([bytes], { type: type || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 30000);
}

function selectedItems(ids) {
  const set = new Set(ids);
  return state.items.filter((i) => set.has(i.id));
}

function finishSelection(msg) {
  state.selected.clear();
  state.selecting = false;
  renderGrid();
  renderFooter();
  if (msg) toast(msg, 2200);
}

async function exportSelectionZip(ids) {
  if (!state.key) { toast('잠금 상태입니다'); return false; }
  const list = selectedItems(ids);
  if (!list.length) { toast('내보낼 사진이 없습니다'); return false; }
  const entries = [];
  const used = new Set();
  try {
    for (let i = 0; i < list.length; i++) {
      const it = list[i];
      if (!state.key) { hideProgress(); toast('잠금 상태가 되어 중단했습니다'); return false; }
      showProgress(i, list.length, '묶는 중 · ' + (it.meta.name || '사진'));
      const b = await idbGet('blobs', it.id);
      if (!b) continue;
      const bytes = await decBytes(state.key, b.iv, b.data);
      const nm = exportNameFor(it);
      entries.push({ name: uniqueFileName(nm.base, nm.ext, used), data: bytes });
      await sleep(0);
    }
    if (!entries.length) { hideProgress(); toast('내보낼 사진이 없습니다'); return false; }
    showProgress(list.length, list.length, '압축 파일 만드는 중');
    const zip = buildZip(entries);
    hideProgress();
    downloadBytes(zip, '시크릿사진_' + stampSec() + '.zip', 'application/zip');
    return true;
  } catch (e) {
    hideProgress();
    console.error(e);
    toast('사진 묶음을 만들지 못했습니다');
    return false;
  }
}

async function exportSelectionSequential(ids) {
  if (!state.key) { toast('잠금 상태입니다'); return false; }
  const list = selectedItems(ids);
  if (!list.length) { toast('내보낼 사진이 없습니다'); return false; }
  const used = new Set();
  let ok = 0;
  try {
    for (let i = 0; i < list.length; i++) {
      const it = list[i];
      if (!state.key) break;
      showProgress(i, list.length, it.meta.name || '사진');
      const b = await idbGet('blobs', it.id);
      if (b) {
        const bytes = await decBytes(state.key, b.iv, b.data);
        const nm = exportNameFor(it);
        downloadBytes(bytes, uniqueFileName(nm.base, nm.ext, used), it.meta.type || (it.meta.kind === 'video' ? 'video/mp4' : 'image/jpeg'));
        ok++;
      }
      if (i < list.length - 1) await sleep(450);
    }
    hideProgress();
  } catch (e) {
    hideProgress();
    console.error(e);
    toast('일부 사진을 내보내지 못했습니다');
  }
  if (!ok) { if (!list.length) return false; toast('사진을 내보내지 못했습니다'); return false; }
  return true;
}

function canSharePhotoFiles() {
  if (typeof navigator.share !== 'function') return false;
  if (typeof navigator.canShare !== 'function') return false;
  try {
    const img = new File([new Uint8Array(8)], 'photo.jpg', { type: 'image/jpeg' });
    const vid = new File([new Uint8Array(8)], 'video.mp4', { type: 'video/mp4' });
    return !!navigator.canShare({ files: [img] }) || !!navigator.canShare({ files: [vid] });
  } catch (e) { return false; }
}

async function buildShareFiles(ids) {
  const list = selectedItems(ids);
  const used = new Set();
  const files = [];
  for (let i = 0; i < list.length; i++) {
    const it = list[i];
    if (!state.key) break;
    showProgress(i, list.length, '공유 준비 · ' + (it.meta.name || '사진'));
    try {
      const b = await idbGet('blobs', it.id);
      if (!b) continue;
      const bytes = await decBytes(state.key, b.iv, b.data);
      const nm = exportNameFor(it);
      const name = uniqueFileName(nm.base, nm.ext, used);
      const type = it.meta.type || (it.meta.kind === 'video' ? 'video/mp4' : (nm.ext === 'jpg' ? 'image/jpeg' : 'image/' + nm.ext));
      try { files.push(new File([bytes], name, { type: type })); }
      catch (e2) { files.push(new File([bytes], name)); }
    } catch (e) {
      console.warn('공유 준비 실패', it.meta && it.meta.name, e);
    }
    await sleep(0);
  }
  hideProgress();
  return files;
}

/* navigator.share 는 반드시 탭 이벤트 안에서(첫 await 전에) 호출해야 합니다. */
function tryShareFiles(files) {
  let p;
  try { p = navigator.share({ files: files }); }
  catch (e) { return Promise.resolve({ ok: false, err: e }); }
  return Promise.resolve(p).then(() => ({ ok: true }), (err) => ({ ok: false, err: err }));
}

function showShareRetryPanel(host, files, close, total) {
  host.textContent = '';
  const note = document.createElement('div');
  note.className = 'doc-note';
  note.textContent = (files.length > 1 ? files.length + '개 항목' : '항목 1개') +
    '을 준비했어요. 브라우저가 자동 공유를 막아서, 아래 버튼을 한 번만 눌러 주세요.';
  host.appendChild(note);
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn primary';
  b.style.flex = '0 0 auto';
  b.textContent = '공유 창 열기';
  host.style.justifyContent = 'center';
  b.addEventListener('click', () => {
    if (b.disabled) return;
    b.disabled = true;
    tryShareFiles(files).then((r) => {
      if (r.ok) { close(); finishSelection(total + '개를 공유했습니다'); return; }
      b.disabled = false;
      if (r.err && r.err.name === 'AbortError') { toast('공유를 취소했습니다'); return; }
      console.error(r.err);
      toast('공유 창을 열지 못했습니다');
    });
  });
  host.appendChild(b);
}

function openExportSheet() {
  const ids = Array.from(state.selected);
  const n = ids.length;
  if (!n) return;
  const shareOk = canSharePhotoFiles();
  let busy = false;
  openSheet({
    title: '어떻게 내보낼까요? · ' + n + '개',
    body: (host, close) => {
      const addOpt = (icon, title, desc, rec, tag, onClick) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt' + (rec ? ' rec' : '');
        const oi = document.createElement('span');
        oi.className = 'oi';
        oi.textContent = icon;
        const ol = document.createElement('span');
        ol.className = 'ol';
        const ot = document.createElement('span');
        ot.className = 'ot';
        const tt = document.createElement('span');
        tt.textContent = title;
        ot.appendChild(tt);
        if (tag) {
          const tg = document.createElement('span');
          tg.className = 'tag';
          tg.textContent = tag;
          ot.appendChild(tg);
        }
        const os = document.createElement('span');
        os.className = 'os';
        os.textContent = desc;
        ol.appendChild(ot);
        ol.appendChild(os);
        b.appendChild(oi);
        b.appendChild(ol);
        b.addEventListener('click', () => {
          if (busy) return;
          busy = true;
          Promise.resolve()
            .then(() => onClick(close, host))
            .catch((e) => { console.error(e); toast('내보내지 못했습니다'); })
            .then(() => { busy = false; });
        });
        host.appendChild(b);
        return b;
      };

      addOpt('📦', '사진·동영상 묶음으로 내려받기 (.zip)',
        '선택한 ' + n + '개를 zip 파일 하나로 받습니다. 갤러리·PC에서 압축을 풀어 보세요.', true, '추천',
        async (close) => {
          const ok = await exportSelectionZip(ids);
          if (ok) { close(); finishSelection(n + '개를 zip 파일로 내려받았습니다'); }
        });

      addOpt('🖼️', '하나씩 차례로 내려받기',
        '450ms 간격으로 하나씩 저장합니다. 크롬이 "여러 파일 다운로드"를 물으면 허용을 눌러 주세요.', false, '',
        async (close) => {
          const ok = await exportSelectionSequential(ids);
          if (ok) { close(); finishSelection(n + '개를 내려받았습니다'); }
        });

      if (shareOk) {
        addOpt('📤', '공유하기 (갤러리·카톡 등)',
          '사진·동영상을 다른 앱으로 바로 보냅니다.', false, '',
          async (close, host) => {
            const files = await buildShareFiles(ids);
            if (!files.length) { toast('공유할 사진·동영상을 준비하지 못했습니다'); return; }
            const r = await tryShareFiles(files);
            if (r.ok) { close(); finishSelection(n + '개를 공유했습니다'); return; }
            if (r.err && r.err.name === 'AbortError') { toast('공유를 취소했습니다'); return; }
            if (r.err && (r.err.name === 'NotAllowedError' || r.err.name === 'SecurityError')) {
              showShareRetryPanel(host, files, close, n);
              return;
            }
            console.error(r.err);
            toast('이 기기에서는 공유를 쓸 수 없습니다');
          });
      }

      addOpt('🔐', '암호화 백업으로 저장 (.svault)',
        '새 기기·브라우저에서 복원할 때 쓰는 암호화 파일입니다.', false, '',
        async (close) => {
          const ok = await exportBackup(new Set(ids));
          if (ok) { close(); finishSelection(); }
        });

      const note = document.createElement('div');
      note.className = 'exp-note';
      note.textContent = 'zip 파일은 갤럭시 \'내 파일\' 앱에서 눌러 압축을 풀면 사진·동영상이 나옵니다.';
      host.appendChild(note);
    },
    actions: [
      { label: '취소', cls: 'ghost', close: true }
    ]
  });
}

function pickBackupFile() {
  const input = $('#backupInput');
  input.value = '';
  input.click();
}

async function onBackupPicked() {
  const input = $('#backupInput');
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  let data;
  try {
    const txt = await f.text();
    data = JSON.parse(txt);
  } catch (e) { toast('백업 파일을 읽을 수 없습니다'); return; }
  if (!data || data.app !== 'svault' || !data.kdf || !data.verifier || !Array.isArray(data.items)) {
    toast('이 앱의 백업 파일이 아닙니다');
    return;
  }
  const pin = await pinSheet('백업 PIN 입력', '이 백업을 만들 때 쓰던 PIN을 입력해 주세요');
  if (!pin) return;

  const sh = openSheet({
    title: '백업을 불러오는 중',
    body: (host) => {
      const p = document.createElement('div');
      p.className = 'doc-note';
      p.textContent = '창을 닫지 말고 기다려 주세요.';
      host.appendChild(p);
      const bar = document.createElement('div');
      bar.className = 'bar';
      const i = document.createElement('i');
      bar.appendChild(i);
      host.appendChild(bar);
      const txt = document.createElement('div');
      txt.className = 'ptext';
      host.appendChild(txt);
      openSheet._bar = i; openSheet._txt = txt;
    },
    actions: [],
    dismissible: false
  });

  try {
    const salt = B64.dec(data.kdf.salt);
    const iterations = data.kdf.iterations || KDF_ITER;
    const bkey = await deriveKey(pin, salt, iterations);
    const ok = await verifyKey(bkey, { verIv: B64.dec(data.verifier.iv), verCt: B64.dec(data.verifier.ct) });
    if (!ok) {
      sh.close();
      toast('백업 PIN이 틀렸습니다');
      return;
    }
    const n = await importData(data, bkey, salt, iterations, pin.length);
    sh.close();
    state.settings.autoLock = state.settings.autoLock;
    toast(n + '개를 복원했습니다');
  } catch (e) {
    console.error(e);
    sh.close();
    toast('복원에 실패했습니다: ' + (e && e.message ? e.message : e));
  }
}

async function importData(data, bkey, salt, iterations, pinLen) {
  const bar = openSheet._bar, txt = openSheet._txt;
  const cfg = state.config;
  const fresh = !cfg;

  let foldersPlain = [];
  if (data.folders) {
    try { foldersPlain = await decJSON(bkey, B64.dec(data.folders.iv), B64.dec(data.folders.ct)); } catch (e) { foldersPlain = []; }
  }

  if (fresh) {
    // 새 기기: 백업의 키·PIN을 그대로 채택
    const cfgNew = {
      k: 'config', v: 1, kdf: 'PBKDF2-SHA256', iterations: iterations, salt: salt,
      verIv: B64.dec(data.verifier.iv), verCt: B64.dec(data.verifier.ct),
      pinLen: pinLen || 4, createdAt: Date.now()
    };
    await idbClear(['meta', 'items', 'blobs', 'items2', 'blobs2']);
    await txP(['meta'], 'readwrite', (tx) => {
      tx.objectStore('meta').put(cfgNew);
      if (data.folders) tx.objectStore('meta').put({ k: 'folders', iv: B64.dec(data.folders.iv), ct: B64.dec(data.folders.ct) });
    });
    state.config = cfgNew;
    state.key = bkey;
    let done = 0;
    for (const it of data.items) {
      await insertItem(
        { createdAt: it.createdAt || Date.now(), metaIv: B64.dec(it.m.iv), metaCt: B64.dec(it.m.ct), thumbIv: B64.dec(it.t.iv), thumbCt: B64.dec(it.t.ct) },
        { iv: B64.dec(it.b.iv), data: B64.dec(it.b.ct) }
      );
      done++;
      if (bar) bar.style.width = Math.round((done / Math.max(1, data.items.length)) * 100) + '%';
      if (txt) txt.textContent = done + ' / ' + data.items.length;
    }
    await loadFolders();
    await loadItems();
    showScreen('vaultView');
    renderAll();
    return done;
  }

  // 기존 금고가 있으면 현재 키로 재암호화하여 병합
  if (!state.key) throw new Error('잠금 상태입니다');
  // 폴더 병합 (이름 기준)
  const idMap = {};
  for (const bf of foldersPlain) {
    let ex = state.folders.find(f => f.name === bf.name);
    if (!ex) {
      ex = { id: 'f_' + uid(), name: bf.name, order: state.folders.length, createdAt: Date.now() };
      state.folders.push(ex);
    }
    idMap[bf.id] = ex.id;
  }
  await saveFolders();

  let done = 0;
  for (const it of data.items) {
    try {
      const meta = await decJSON(bkey, B64.dec(it.m.iv), B64.dec(it.m.ct));
      const thumb = await decBytes(bkey, B64.dec(it.t.iv), B64.dec(it.t.ct));
      const blob = await decBytes(bkey, B64.dec(it.b.iv), B64.dec(it.b.ct));
      if (meta.folderId && idMap[meta.folderId]) meta.folderId = idMap[meta.folderId];
      meta.createdAt = meta.createdAt || it.createdAt || Date.now();
      const me = await encJSON(state.key, meta);
      const te = await encBytes(state.key, thumb);
      const be = await encBytes(state.key, blob);
      await insertItem({ createdAt: meta.createdAt, metaIv: me.iv, metaCt: me.ct, thumbIv: te.iv, thumbCt: te.ct }, { iv: be.iv, data: be.ct });
      done++;
    } catch (e) { console.warn('항목 복원 실패', e); }
    if (bar) bar.style.width = Math.round((done / Math.max(1, data.items.length)) * 100) + '%';
    if (txt) txt.textContent = done + ' / ' + data.items.length;
    await sleep(0);
  }
  await loadItems();
  renderAll();
  return done;
}

/* ───────────── 자동 잠금 ───────────── */
function initAutoLock() {
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      const v = $('#vwVideo');
      if (v) { try { v.pause(); } catch (e) {} }
      maybeAutoLock();
    }
  });
  window.addEventListener('pagehide', () => { maybeAutoLock(); });
  // 파일 선택창에서 돌아오면 보류를 풀어 준다(선택 중 잠기는 것을 막기 위한 짧은 유예)
  window.addEventListener('focus', () => {
    setTimeout(() => { if (!state.uploads) state.lockGuardUntil = 0; }, 1200);
  });
}

/* ───────────── 부트 ───────────── */
async function boot() {
  if (!assertCrypto()) return;
  loadSettings();
  try { db = await openDB(); }
  catch (e) {
    fatal('이 브라우저에서 저장소(IndexedDB)를 열 수 없습니다.',
      '시크릿 모드에서는 저장이 막힐 수 있습니다. 일반 탭에서 https://bluerorqual-75.github.io/secret-vault/ 로 다시 열어 주세요. (' + (e && e.message ? e.message : e) + ')');
    return;
  }
  let cfg = null;
  try { cfg = await idbGet('meta', 'config'); } catch (e) { cfg = null; }
  if (cfg) { state.config = cfg; showLock(); }
  else showSetup();
}

/* 이벤트 배선 */
function wire() {
  buildKeypad($('#setupKeypad'), setupKey);
  buildKeypad($('#lockKeypad'), lockKey);
  buildCalc();

  $('#restoreBtn').addEventListener('click', () => pickBackupFile());
  $('#toCalcBtn').addEventListener('click', () => showLock(true));

  $('#lockBtn').addEventListener('click', () => lockVault());
  $('#setBtn').addEventListener('click', () => { if (state.key) openSettings(); });

  $('#addBtn').addEventListener('click', () => startAdd());
  $('#fileInput').addEventListener('change', onFilesPicked);
  $('#backupInput').addEventListener('change', onBackupPicked);

  $('#selBtn').addEventListener('click', () => toggleSelectMode(true));
  $('#selCancel').addEventListener('click', () => toggleSelectMode(false));
  $('#selMove').addEventListener('click', () => bulkMove());
  $('#selDel').addEventListener('click', () => bulkDelete());
  $('#selExport').addEventListener('click', async () => {
    const ids = Array.from(state.selected);
    if (!ids.length) return;
    if (ids.length === 1) {
      // 1개: 뷰어 내보내기처럼 실제 원본 파일을 바로 저장
      const it = state.items.find(i => i.id === ids[0]);
      if (!it) return;
      await downloadItem(it);
      finishSelection();
      return;
    }
    // 2장 이상: 방식 선택 시트
    openExportSheet();
  });

  // 그리드 클릭 (선택/뷰어)
  $('#grid').addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    if (Date.now() < (state.suppressClick || 0)) { state.suppressClick = 0; return; }
    const id = Number(tile.dataset.id);
    if (state.selecting) { toggleSelect(id); return; }
    openViewer(id);
  });
  // 길게 누르면 선택 모드
  let lpTimer = null;
  $('#grid').addEventListener('pointerdown', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile || state.selecting) return;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      state.suppressClick = Date.now() + 900;
      state.selecting = true;
      toggleSelect(Number(tile.dataset.id));
      renderFooter();
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
    }, 520);
  });
  ['pointerup', 'pointercancel', 'pointermove'].forEach(ev => {
    $('#grid').addEventListener(ev, () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } });
  });

  $('#vwClose').addEventListener('click', () => closeViewer());
  $('#vwPrev').addEventListener('click', () => viewerStep(-1));
  $('#vwNext').addEventListener('click', () => viewerStep(1));
  $('#vwFav').addEventListener('click', () => viewerFavorite());
  $('#vwMove').addEventListener('click', () => viewerMove());
  $('#vwDown').addEventListener('click', () => {
    const it = state.items.find(i => i.id === state.viewerItemId);
    if (it) downloadItem(it);
  });
  $('#vwDel').addEventListener('click', () => viewerDelete());

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('#viewer').classList.contains('on')) closeViewer();
      else if (sheetOpen) closeSheet();
    }
  });

  initViewerGestures();
  initAutoLock();
}

/* ───────────── 계산기 위장 ───────────── */
const calcState = { expr: '', done: false, out: null };

function buildCalc() {
  const el = $('#calcKeys');
  el.innerHTML = '';
  const keys = [
    { k: 'C', cls: 'fn' }, { k: '⌫', cls: 'fn' }, { k: '%', cls: 'fn' }, { k: '÷', cls: 'op' },
    { k: '7' }, { k: '8' }, { k: '9' }, { k: '×', cls: 'op' },
    { k: '4' }, { k: '5' }, { k: '6' }, { k: '−', cls: 'op' },
    { k: '1' }, { k: '2' }, { k: '3' }, { k: '+', cls: 'op' },
    { k: '0', cls: 'wide' }, { k: '.' }, { k: '=', cls: 'eq' }
  ];
  keys.forEach(o => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = o.k;
    if (o.cls) b.className = o.cls;
    b.dataset.k = o.k;
    b.addEventListener('click', () => calcKey(o.k));
    el.appendChild(b);
  });
  // 디스플레이 길게 누르면 PIN 키패드로 (위장 해제)
  let lp = null;
  const disp = $('.calc-screen');
  disp.addEventListener('pointerdown', () => { lp = setTimeout(() => { state.settings.calcDisguise = false; saveSettings(); lockBuf = ''; showLock(); }, 900); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => disp.addEventListener(ev, () => { if (lp) { clearTimeout(lp); lp = null; } }));
}

function tailNumber(expr) {
  const m = expr.match(/(\d*\.?\d+)$/);
  return m ? m[1] : '';
}
function renderCalc() {
  $('#calcExpr').textContent = calcState.expr.replace(/\*/g, '×').replace(/\//g, '÷');
  const big = calcState.out != null ? String(calcState.out) : (tailNumber(calcState.expr) || '0');
  $('#calcOut').textContent = big;
}

function evalCalc(expr) {
  let e = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  if (!/^[0-9.+\-*/]+$/.test(e)) return null;
  e = e.replace(/[+\-*/]+$/, '');
  if (!e) return null;
  try {
    const v = Function('"use strict";return (' + e + ')')();
    if (typeof v !== 'number' || !isFinite(v)) return null;
    return Math.round(v * 1e10) / 1e10;
  } catch (err) { return null; }
}

async function calcKey(k) {
  if (k === 'C') { calcState.expr = ''; calcState.out = null; calcState.done = false; renderCalc(); return; }
  if (k === '⌫') {
    if (calcState.done) { calcState.expr = ''; calcState.out = null; calcState.done = false; }
    else calcState.expr = calcState.expr.slice(0, -1);
    renderCalc();
    return;
  }
  if (k === '=') {
    const raw = calcState.expr.replace(/\s/g, '');
    if (/^\d{4,6}$/.test(raw) && state.config && raw.length === state.config.pinLen) {
      const ok = await tryUnlock(raw, false);
      if (ok) { calcState.expr = ''; calcState.out = null; calcState.done = false; return; }
      // 틀렸을 때는 틀렸다는 티를 내지 않고 계산 결과처럼 숫자만 보여 준다
      calcState.out = raw; calcState.done = true; renderCalc(); return;
    }
    const v = evalCalc(raw);
    calcState.out = v === null ? 'Error' : String(v);
    calcState.done = true;
    renderCalc();
    return;
  }
  if (k === '%') {
    calcState.expr = calcState.expr.replace(/(\d*\.?\d+)$/, (m) => String(parseFloat(m) / 100));
    calcState.out = null;
    renderCalc();
    return;
  }
  if (calcState.done) {
    if (/[+\-×÷]/.test(k)) calcState.expr = String(calcState.out === 'Error' ? 0 : calcState.out) + k;
    else calcState.expr = k;
    calcState.done = false;
    calcState.out = null;
    renderCalc();
    return;
  }
  if (/[0-9]/.test(k)) {
    const tail = tailNumber(calcState.expr);
    if (tail === '0' && k !== '.') calcState.expr = calcState.expr.slice(0, -1);
  }
  if (k === '.' && /\.\d*$/.test(calcState.expr)) return;
  calcState.expr += k;
  calcState.out = null;
  renderCalc();
}

/* 시작 */
window.__svault = {
  isUnlocked: () => !!state.key,
  itemCount: () => state.items.length,
  folderNames: () => state.folders.map(f => f.name),
  view: () => state.view,
  items: () => state.items.map(i => ({
    id: i.id, name: i.meta.name, type: i.meta.type, size: i.meta.size,
    kind: itemKind(i), duration: i.meta.duration || 0, folderId: i.meta.folderId || null, fav: !!i.meta.fav
  })),
  addFiles: (files, folderId) => addFiles(files, folderId === undefined ? null : folderId),
  openViewer: (id) => openViewer(id),
  step: (d) => viewerStep(d),
  closeViewer: (silent) => closeViewer(silent),
  lock: (silent) => lockVault(silent !== false),
  viewer: () => ({
    id: state.viewerItemId, kind: state.viewerKind,
    imgUrl: state.viewerUrl, videoUrl: state.viewerVideoUrl,
    videoSrc: ($('#vwVideo') || {}).src || ''
  }),
  snap: () => ({
    unlocked: !!state.key, items: state.items.length, folders: state.folders.length,
    view: state.view, folderId: state.folderId, selecting: state.selecting,
    selected: state.selected.size, settings: Object.assign({}, state.settings),
    screen: ['setupView', 'lockView', 'vaultView'].filter(s => $('#' + s).classList.contains('on'))[0],
    calc: { expr: calcState.expr, out: calcState.out }
  })
};

wire();
boot();
